<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>엔화 환율 데이터 기간별 조회</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f8f9fa; color: #333; }
    .container { max-width: 950px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #2c3e50; }
    
    .section-box { background: #eef2f5; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
    .section-title { font-weight: bold; margin-bottom: 10px; color: #495057; }
    
    .filter-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    input[type="date"], input[type="file"] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; background: white; }
    
    button { padding: 7px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0056b3; }

    .chart-container { position: relative; width: 100%; height: 380px; margin-top: 15px; }
    #statusMsg { font-weight: bold; color: #495057; margin-top: 10px; }

    .table-wrap { margin-top: 20px; overflow-x: auto; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data-table th, table.data-table td { padding: 8px 10px; border-bottom: 1px solid #e9ecef; text-align: left; white-space: nowrap; }
    table.data-table th { background: #eef2f5; color: #495057; position: sticky; top: 0; }
    table.data-table tbody tr:hover { background: #f8f9fa; }
    table.data-table td a { color: #007bff; text-decoration: none; }
    table.data-table td a:hover { text-decoration: underline; }

    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .status-dot.ok { background: #28a745; }
    .status-dot.bad { background: #d9534f; }
    .status-cell { white-space: nowrap; font-weight: bold; }
    .status-cell.ok-text { color: #28a745; }
    .status-cell.bad-text { color: #d9534f; }

  </style>
</head>
<body>
  <div class="container">
    <h2>💴 엔화(JPY) 환율 데이터 기간별 조회</h2>

    <!-- 1. 기간 조회 구역 -->
    <div class="section-box">
      <div class="section-title">📅 1. 기간 조회</div>
      <div class="filter-box">
        <label for="startDate">시작일:</label>
        <input type="date" id="startDate" min="2025-01-01">
        
        <label for="endDate">종료일:</label>
        <input type="date" id="endDate" min="2025-01-01">

        <button onclick="loadAndDrawChart()">구간 조회</button>
      </div>
      <div style="font-size: 12px; color: #6c757d; margin-top: 6px;">
        * 최소 조회 날짜: <strong>2025-01-01</strong> | * 최대 조회 구간: <strong>1개월(31일)</strong>
      </div>
    </div>

    <!-- 2. 로컬 JSON 파일 첨부 구역 -->
    <div class="section-box">
      <div class="section-title">📁 2. 로컬 JSON 파일 첨부하기</div>
      <div class="filter-box">
        <input type="file" id="fileInput" accept=".json" multiple onchange="handleFileUpload(event)">
      </div>
    </div>

    <div id="statusMsg">날짜 범위를 지정하고 [구간 조회] 버튼을 누르세요.</div>

    <!-- 그래프 영역 -->
    <div class="chart-container">
      <canvas id="valueChart"></canvas>
    </div>

    <!-- 필드별 데이터 목록 -->
    <h4 style="margin-bottom: 6px; color: #2c3e50;">📋 데이터 목록 </h4>
    <div class="table-wrap" id="dataTableContainer">
      <p style="color:#868e96; font-size:13px;">조회하거나 파일을 첨부하면 여기에 표시됩니다.</p>
    </div>
  </div>

  <script>
    let myChart = null;
    const MIN_DATE = "2025-01-01";

    // 현재 그래프/표에 표시 중인 전체 데이터 (구간 조회 결과 + 첨부파일로 추가된 데이터가 함께 누적됩니다)
    let currentPoints = [];

    // 날짜별 데이터 캐시: 저장소(repo)에는 저장되지 않고, 이 탭을 열어둔 세션 동안만 메모리에 유지됩니다.
    // (새로고침하면 초기화됩니다.)
    const sessionDataCache = {};

    // 병합/캐시 키로 source_time 대신 _mergeKey를 사용합니다.
    // 날짜가 있는 정상 데이터는 기존과 동일하게 "같은 날짜=같은 행"으로 묶이고,
    // 날짜가 없는 오류 이벤트는 서로 다른 고유 키를 가지므로 소실되지 않고 각각 보존됩니다. (문서 4-2)
    function cacheStandardPoints(items) {
      const deduped = dedupeByMergeKey(items);
      const byKey = {};
      deduped.forEach(item => {
        const k = item._mergeKey ?? item.source_time;
        if (!k) return;
        if (!byKey[k]) byKey[k] = [];
        byKey[k].push(item);
      });
      // 새로 들어온 키의 데이터로 해당 키의 캐시를 갱신(교체)합니다.
      Object.keys(byKey).forEach(k => {
        sessionDataCache[k] = byKey[k];
      });
    }

    // 같은 _mergeKey를 가진 항목이 한 배치(newPoints) 안에 여러 개 있을 경우(예: 파일 여러 개를 한 번에 선택),
    // 도착 순서상 마지막 항목만 남깁니다(같은 날짜 재조회 = 같은 행 갱신). 오류 이벤트는 각자 고유 키를 가지므로 영향 없습니다.
    function dedupeByMergeKey(items) {
      const map = new Map();
      items.forEach(item => {
        map.set(item._mergeKey ?? item.source_time ?? item, item);
      });
      return Array.from(map.values());
    }

    // newPoints를 currentPoints(현재 화면에 표시 중인 데이터)에 병합하고 다시 그립니다.
    // newPoints에 포함된 _mergeKey는 기존 currentPoints의 같은 키 데이터를 덮어씁니다(교체).
    function mergeIntoCurrentView(newPoints, titleLabel) {
      const dedupedNewPoints = dedupeByMergeKey(newPoints);
      const incomingKeys = new Set(dedupedNewPoints.map(p => p._mergeKey ?? p.source_time));
      // 같은 키의 기존 데이터는 제거하고 새 데이터로 교체
      currentPoints = currentPoints.filter(p => !incomingKeys.has(p._mergeKey ?? p.source_time));
      currentPoints.push(...dedupedNewPoints);
      renderChart(currentPoints, titleLabel);
      renderDataTable(currentPoints);
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return '-';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // status가 1 또는 200이면 정상. 정상이더라도 화면에 표시해야 하는 5개 필드
    // (status, stored_value, source_time, delay_ms, source_url) 중 하나라도 null/undefined면 비정상으로 처리합니다.
    function isNormalItem(item) {
      if (!item) return false;

      const statusOk = item.status === 1 || item.status === '1' || item.status === 200 || item.status === '200';
      if (!statusOk) return false;

      const requiredFields = ['status', 'stored_value', 'source_time', 'delay_ms', 'source_url'];
      return requiredFields.every(f => item[f] !== null && item[f] !== undefined);
    }

    // [인수인계 문서 4-4] error_code / freshness 판정과 [문서 4-3] 직전 정상값 보존(preserve_last_good) 로직.
    //
    // 세션 동안 유지되는 "직전 정상값" 상태. 오류 발생 시 이 값을 그대로 이어서 보여줍니다.
    let lastGoodValue = null;
    let lastGoodTime = null; // 마지막 정상값이 관측된 날짜(YYYY-MM-DD)
    let seqCounter = 0;      // 첨부/조회 처리 순서(도착 순서) 기록용

    // 픽스처가 정의하는 5가지 오류 유형(문서 1-3). 이 유형에 한해서만 "직전 정상값 보존"을 적용합니다.
    // (운영 데이터의 원인 미상 오류까지 직전 값으로 덮어쓰는 것은 이번 작업 범위를 벗어나므로 제외합니다. 문서 6 참고)
    const FIXTURE_ERROR_CODES = new Set(['schema_error', 'auth', 'rate_limit', 'timeout', 'offline']);

    const ERROR_LABELS = {
      none: '정상',
      schema_error: '비정상 (스키마 오류)',
      auth: '비정상 (인증 실패)',
      rate_limit: '비정상 (요청 제한)',
      timeout: '비정상 (타임아웃)',
      offline: '비정상 (오프라인)',
      unknown: '비정상'
    };

    // transport.mode/status 및 필수 필드 결측 여부를 조합해 error_code를 판별합니다. (문서 4-4)
    function determineErrorCode(item) {
      if (!item._isFixture) {
        // 운영 데이터(배열) 형식은 기존 정상/비정상 이진 판정을 그대로 재사용합니다.
        return isNormalItem(item) ? 'none' : 'unknown';
      }
      const mode = item._transportMode;
      if (mode === 'timeout') return 'timeout';
      if (mode === 'offline') return 'offline';
      if (item.status === 401 || item.status === '401') return 'auth';
      if (item.status === 429 || item.status === '429') return 'rate_limit';

      // 전송 자체는 성공(예: HTTP 200)했지만 표준 변환 결과 필수 필드가 비어있다면 스키마 오류로 판단합니다.
      const requiredFields = ['status', 'stored_value', 'source_time', 'delay_ms', 'source_url'];
      const hasAllFields = requiredFields.every(f => item[f] !== null && item[f] !== undefined);
      return hasAllFields ? 'none' : 'schema_error';
    }

    // 오류 이벤트처럼 날짜 정보가 없는 항목의 정렬/표시 시각을 계산합니다.
    // (문서 6 "확인 필요 사항": source_time이 없는 오류 이벤트는 virtual_now를 참고해
    //  "직전 정상값이 관측된 날짜" 바로 뒤, 첨부(처리)된 순서대로 배치하는 것으로 확정했습니다.)
    function displayTimeLabel(item) {
      if (item.source_time) return item.source_time;
      if (item.virtual_now) {
        const cleaned = String(item.virtual_now).replace('T', ' ').replace(/\.\d+Z?$/, '');
        return `${cleaned} (관측시각)`;
      }
      return '-';
    }

    // 표준화된 항목 배열을 "도착(처리) 순서" 그대로 훑으면서 error_code/freshness를 부여하고,
    // 오류 항목은 stored_value를 직전 정상값으로 대체합니다. 정렬용 _sortTime도 함께 계산합니다.
    function attachDerivedFields(items) {
      items.forEach(item => {
        item._seq = seqCounter++;
        item.error_code = determineErrorCode(item);
        item.freshness = item.error_code === 'none' ? 'fresh' : 'stale';

        if (item.error_code === 'none') {
          lastGoodValue = item.stored_value;
          lastGoodTime = item.source_time;
        } else if (FIXTURE_ERROR_CODES.has(item.error_code) && lastGoodValue !== null) {
          item.stored_value = lastGoodValue; // 직전 정상값 보존 (문서 4-3)
        }

        const baseTime = item.source_time
          ? new Date(item.source_time).getTime()
          : (lastGoodTime ? new Date(lastGoodTime).getTime() : 0);
        item._sortTime = baseTime + item._seq; // ms 단위 미세 오프셋으로 도착 순서를 유지
      });
      return items;
    }

    function getSortableTime(item) {
      return item._sortTime ?? 0;
    }

    function renderDataTable(items) {
      const container = document.getElementById('dataTableContainer');
      if (!items || items.length === 0) {
        container.innerHTML = '<p style="color:#868e96; font-size:13px;">표시할 데이터가 없습니다.</p>';
        return;
      }

      const sorted = [...items].sort((a, b) => getSortableTime(a) - getSortableTime(b));

      const rows = sorted.map(item => {
        const dateOnly = toDateOnly(item.source_time);
        const jsonPath = dateOnly ? `./data/auction_${dateOnly}.json` : null;
        const urlCell = jsonPath
          ? `<a href="${escapeHtml(jsonPath)}" target="_blank" rel="noopener noreferrer">JSON 보기</a>`
          : '-';
        const errorCode = item.error_code ?? (isNormalItem(item) ? 'none' : 'unknown');
        const ok = errorCode === 'none';
        const dotClass = ok ? 'ok' : 'bad';
        const textClass = ok ? 'ok-text' : 'bad-text';
        const label = ERROR_LABELS[errorCode] ?? '비정상';
        return `
          <tr>
            <td class="status-cell ${textClass}"><span class="status-dot ${dotClass}"></span>${label}</td>
            <td>${escapeHtml(displayTimeLabel(item))}</td>
            <td>${escapeHtml(item.status)}</td>
            <td>${escapeHtml(item.stored_value)}</td>
            <td>${escapeHtml(item.delay_ms)}</td>
            <td>${urlCell}</td>
          </tr>`;
      }).join('');

      container.innerHTML = `
        <table class="data-table">
          <thead>
            <tr>
              <th>상태</th>
              <th>기준 일</th>
              <th>상태 코드</th>
              <th>환율 값</th>
              <th>데이터 요청 시간</th>
              <th>원본 json</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    window.onload = () => {
      const today = new Date();
      const lastWeek = new Date();
      lastWeek.setDate(today.getDate() - 7);

      document.getElementById('endDate').value = today.toISOString().substring(0, 10);
      document.getElementById('startDate').value = lastWeek.toISOString().substring(0, 10);
    };

    // source_time 값에서 앞의 YYYY-MM-DD 부분만 인식합니다.
    // (예: "2026-08-27T10:32:00" 또는 "2026-08-27 10:32:00" -> "2026-08-27")
    // 패턴에 맞지 않으면 원래 값을 그대로 반환합니다.
    function toDateOnly(value) {
      if (value === null || value === undefined) return value;
      const match = String(value).match(/^\d{4}-\d{2}-\d{2}/);
      return match ? match[0] : value;
    }

    // [인수인계 문서 4-1, 4-2] 테스트 픽스처({payload, transport, expected}) 형태를 표준 항목으로 변환합니다.
    //
    // 기준 일(source_time) 결정 우선순위:
    //   1) expected.record_date : 픽스처가 명시한 "논리적 날짜"(같은 날 재조회를 한 행으로 묶기 위한 값)
    //   2) payload.source_time  : 실제 관측 시각(날짜만 추출)
    //   3) expected.source_time : 위 두 값이 없을 때의 보조값
    // 세 값이 모두 없으면(=스키마 오류/인증 실패/요청 제한/타임아웃/오프라인 등 오류 이벤트) source_time은 null이 되며,
    // 이 경우 서로 다른 오류 이벤트끼리 같은 값(null)으로 묶여 덮어쓰지 않도록 virtual_now(관측 시각)를
    // 기반으로 한 별도의 병합 키(_mergeKey)를 부여해 각각 독립된 레코드로 유지합니다. (문서 4-2 대응)
    function parseToStandardFormat(rawData) {
      let result = [];
      const isFixtureFormat = !!(rawData.payload || rawData.transport || rawData.expected);

      if (isFixtureFormat) {
        const dateKey = toDateOnly(
          rawData.expected?.record_date ?? rawData.payload?.source_time ?? rawData.expected?.source_time ?? null
        );
        const fallbackId = rawData.virtual_now ?? rawData.payload?.fetched_at ?? null;

        result.push({
          status: rawData.transport?.status ?? null,
          stored_value: rawData.expected?.stored_value ?? null,
          source_time: dateKey,
          delay_ms: rawData.transport?.delay_ms ?? null,
          source_url: rawData.payload?.source_url ?? null,
          virtual_now: rawData.virtual_now ?? null,
          _isFixture: true,
          _transportMode: rawData.transport?.mode ?? null,
          _mergeKey: dateKey ?? `err:${fallbackId ?? (Math.random().toString(36).slice(2) + Date.now())}`
        });
      } else if (Array.isArray(rawData)) {
        result = rawData.map(item => {
          const sourceTime = toDateOnly(item.source_time);
          return { ...item, source_time: sourceTime, _isFixture: false, _mergeKey: sourceTime };
        });
      }
      return result;
    }

    // 메인 기간 조회 제어
    async function loadAndDrawChart() {
      const startDateStr = document.getElementById('startDate').value;
      const endDateStr = document.getElementById('endDate').value;
      const statusMsg = document.getElementById('statusMsg');

      if (!startDateStr || !endDateStr) return alert("시작일과 종료일을 선택하세요.");

      if (startDateStr < MIN_DATE || endDateStr < MIN_DATE) {
        return alert(`2025년 1월 1일 이전 데이터는 조회할 수 없습니다. (최소: ${MIN_DATE})`);
      }

      if (startDateStr > endDateStr) {
        return alert("시작일은 종료일보다 이전이어야 합니다.");
      }

      const start = new Date(startDateStr);
      const end = new Date(endDateStr);
      const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;

      if (diffDays > 31) {
        return alert(`조회 구간은 최대 1개월(31일)까지로 제한됩니다. (현재 선택: ${diffDays}일)`);
      }

      statusMsg.textContent = "저장된 데이터 파일 확인 중...";

      const targetDates = getDateRange(startDateStr, endDateStr);
      let allStandardPoints = [];
      let missingDates = [];

      // 세션 캐시 → 없으면 저장소 데이터 파일 확인
      const fetchPromises = targetDates.map(async (dateStr) => {
        if (sessionDataCache[dateStr]) {
          return sessionDataCache[dateStr];
        }
        try {
          const res = await fetch(`./data/auction_${dateStr}.json`);
          if (res.ok) {
            const data = await res.json();
            const items = attachDerivedFields(parseToStandardFormat(data));
            sessionDataCache[dateStr] = items; // 세션 동안 기억
            return items;
          } else {
            missingDates.push(dateStr);
            return [];
          }
        } catch (e) {
          missingDates.push(dateStr);
          return [];
        }
      });

      const results = await Promise.all(fetchPromises);
      results.forEach(items => {
        if (items) allStandardPoints.push(...items);
      });

      if (allStandardPoints.length === 0) {
        statusMsg.innerHTML = `<span style="color:#d9534f;">⚠️ 선택한 기간의 수집된 데이터가 없습니다.</span><br>` +
                              `<small>(누락된 날짜: ${missingDates.join(', ')} — GitHub Actions 워크플로우를 수동으로 실행하거나, 스케줄 실행을 기다려 주세요. 또는 아래에서 해당 날짜의 JSON 파일을 첨부하면 그래프에 바로 반영됩니다.)</small>`;
        if (myChart) myChart.destroy();
        currentPoints = [];
        renderDataTable([]);
        return;
      }

      currentPoints = allStandardPoints;
      renderChart(currentPoints, `조회 구간: ${startDateStr} ~ ${endDateStr}`);
      renderDataTable(currentPoints);
      statusMsg.textContent = '';
    }

    function getDateRange(startStr, endStr) {
      const dates = [];
      let current = new Date(startStr);
      const last = new Date(endStr);
      while (current <= last) {
        dates.push(current.toISOString().substring(0, 10));
        current.setDate(current.getDate() + 1);
      }
      return dates;
    }

    async function handleFileUpload(event) {
      const files = event.target.files;
      const statusMsg = document.getElementById('statusMsg');

      if (!files || files.length === 0) return;

      let allPoints = [];
      for (let file of files) {
        try {
          const text = await file.text();
          const json = JSON.parse(text);
          allPoints.push(...parseToStandardFormat(json));
        } catch (err) {
          console.error("파일 해석 에러:", err);
        }
      }

      attachDerivedFields(allPoints);
      cacheStandardPoints(allPoints);
      mergeIntoCurrentView(allPoints, "구간 조회 + 첨부파일 데이터");
      const normalCount = currentPoints.filter(item => (item.error_code ?? 'none') === 'none').length;
      const abnormalCount = currentPoints.length - normalCount;
      statusMsg.textContent = `첨부파일로부터 ${allPoints.length}건을 추가했습니다. (현재 그래프에 반영됨, 총 ${currentPoints.length}건 · 정상 ${normalCount}건 / 비정상 ${abnormalCount}건 · 날짜별로 세션 동안 기억됩니다)`;
    }

    function renderChart(standardDataList, titleLabel) {
      // 그래프에는 "정상" 데이터와, preserve_last_good이 적용된 픽스처 오류 데이터(직전 정상값을 이어서 표시)를 함께 반영합니다.
      // 운영 데이터의 원인 미상 비정상(error_code === 'unknown')은 기존과 동일하게 그래프에서 제외합니다. (문서 4-3, 6)
      const chartList = standardDataList.filter(item => {
        const code = item.error_code ?? (isNormalItem(item) ? 'none' : 'unknown');
        return code === 'none' || FIXTURE_ERROR_CODES.has(code);
      });
      chartList.sort((a, b) => getSortableTime(a) - getSortableTime(b));

      const labels = chartList.map(item => item.source_time ?? displayTimeLabel(item));
      const values = chartList.map(item => item.stored_value ?? null);
      const isStale = chartList.map(item => (item.error_code ?? 'none') !== 'none');

      if (myChart) myChart.destroy();

      const ctx = document.getElementById('valueChart').getContext('2d');
      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `stored_value (${titleLabel})`,
            data: values,
            borderColor: '#007bff',
            backgroundColor: 'rgba(0, 123, 255, 0.15)',
            borderWidth: 2,
            // 오류(직전 정상값 보존) 구간은 기존 상태 뱃지와 같은 색(#d9534f)의 마커로 구분합니다.
            pointRadius: isStale.map(stale => stale ? 5 : 4),
            pointStyle: isStale.map(stale => stale ? 'rectRot' : 'circle'),
            pointBackgroundColor: isStale.map(stale => stale ? '#d9534f' : '#007bff'),
            pointBorderColor: isStale.map(stale => stale ? '#d9534f' : '#007bff'),
            segment: {
              // 오류 구간과 맞닿은 선분은 점선으로 그려 정상 구간과 구분합니다.
              borderDash: (segCtx) => (isStale[segCtx.p0DataIndex] || isStale[segCtx.p1DataIndex]) ? [6, 4] : undefined
            },
            fill: true,
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: '기록 일시 (source_time)' } },
            y: { title: { display: true, text: '저장 값 (stored_value = TTB 전신환 받으실때 환율)' } }
          }
        }
      });
    }
  </script>

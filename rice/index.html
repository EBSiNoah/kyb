<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T04 오늘의 진짜 정보판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-6">

  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md border border-slate-200">
    <header class="mb-6 flex justify-between items-center border-b pb-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">🌾 T04 오늘의 진짜 정보판 (배추 시세)</h1>
        <p class="text-xs text-slate-500 mt-1" id="sourceUrl">출처: 로딩 중...</p>
      </div>
      <div id="statusBadge" class="px-3 py-1.5 rounded-full font-bold text-xs flex items-center gap-1.5 bg-gray-100 text-gray-600">
        <span class="w-2 h-2 rounded-full bg-gray-400"></span>
        <span>LOADING</span>
      </div>
    </header>

    <!-- 외부 JSON 파일 첨부/드롭 영역 (웹 검증용) -->
    <div id="dropZone" class="mb-6 border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-lg p-4 text-center bg-slate-50 transition-colors cursor-pointer">
      <input type="file" id="fileInput" accept=".json" class="hidden">
      <p class="text-xs text-slate-600 font-medium">📥 테스트할 외부 JSON 파일(Fixture)을 이곳에 드래그하거나 클릭하여 업로드하세요</p>
      <p class="text-[10px] text-slate-400 mt-1">정상 JSON 및 장애 JSON(timeout, auth-401 등)을 즉시 시뮬레이션합니다.</p>
    </div>

    <!-- 대시보드 카드 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
        <div class="text-xs text-slate-500 mb-1">최신 정규화 값</div>
        <div class="text-3xl font-extrabold text-blue-600" id="latestValue">-</div>
      </div>
      <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
        <div class="text-xs text-slate-500 mb-1">전일 대비 변화량</div>
        <div class="text-3xl font-extrabold" id="deltaValue">-</div>
      </div>
      <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
        <div class="text-xs text-slate-500 mb-1">관측 시각 (KST)</div>
        <div class="text-xs font-mono font-medium text-slate-700 mt-2" id="observedAt">-</div>
      </div>
    </div>

    <!-- 차트 -->
    <div class="mb-6 relative h-64 border border-slate-100 rounded-lg p-2">
      <canvas id="priceChart"></canvas>
    </div>

    <!-- 기록 테이블 -->
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs border-collapse">
        <thead>
          <tr class="bg-slate-100 text-slate-600 border-b">
            <th class="p-2">날짜 (record_date)</th>
            <th class="p-2">Signal ID</th>
            <th class="p-2 text-right">정규화 값 (value)</th>
            <th class="p-2">관측 시각</th>
          </tr>
        </thead>
        <tbody id="historyTable" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>

  <script>
    let appState = { status: 'fresh', error_code: 'none' };
    let historyData = {};
    let chartInstance = null;

    async function init() {
      try {
        const [hRes, sRes] = await Promise.all([
          fetch('./data/history.json?t=' + Date.now()),
          fetch('./data/status.json?t=' + Date.now())
        ]);
        if (hRes.ok) historyData = await hRes.json();
        if (sRes.ok) appState = await sRes.json();
      } catch (e) {
        console.warn("로컬 서버 데이터 미발견. 기본 UI로 시작합니다.");
      }
      renderUI();
    }

    function renderUI() {
      const badge = document.getElementById('statusBadge');
      if (appState.status === 'fresh') {
        badge.className = "px-3 py-1.5 rounded-full font-bold text-xs flex items-center gap-1.5 bg-emerald-100 text-emerald-800";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>FRESH / NONE</span>`;
      } else {
        badge.className = "px-3 py-1.5 rounded-full font-bold text-xs flex items-center gap-1.5 bg-rose-100 text-rose-800";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span><span>STALE / ${appState.error_code.toUpperCase()}</span>`;
      }

      const dates = Object.keys(historyData).sort();
      const tbody = document.getElementById('historyTable');
      tbody.innerHTML = '';

      if (dates.length === 0) {
        document.getElementById('latestValue').textContent = '-';
        document.getElementById('deltaValue').textContent = '-';
        document.getElementById('observedAt').textContent = '-';
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">저장된 데이터가 없습니다.</td></tr>`;
        updateChart([], []);
        return;
      }

      const latestDate = dates[dates.length - 1];
      const latestItem = historyData[latestDate];

      document.getElementById('latestValue').textContent = `${latestItem.normalized_value.toLocaleString()} ${latestItem.unit}`;
      document.getElementById('observedAt').textContent = latestItem.source_observed_at || '-';
      document.getElementById('sourceUrl').textContent = `출처: ${latestItem.source_url || '-'}`;

      if (dates.length >= 2) {
        const prevItem = historyData[dates[dates.length - 2]];
        const delta = latestItem.normalized_value - prevItem.normalized_value;
        const deltaEl = document.getElementById('deltaValue');
        if (delta > 0) {
          deltaEl.className = "text-3xl font-extrabold text-rose-500";
          deltaEl.textContent = `+${delta.toLocaleString()} ${latestItem.unit}`;
        } else if (delta < 0) {
          deltaEl.className = "text-3xl font-extrabold text-blue-500";
          deltaEl.textContent = `${delta.toLocaleString()} ${latestItem.unit}`;
        } else {
          deltaEl.className = "text-3xl font-extrabold text-slate-600";
          deltaEl.textContent = `0 ${latestItem.unit}`;
        }
      } else {
        document.getElementById('deltaValue').textContent = `0 ${latestItem.unit}`;
      }

      [...dates].reverse().forEach(d => {
        const row = historyData[d];
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-2 font-bold">${row.record_date}</td>
          <td class="p-2 text-slate-500 font-mono">${row.signal_id}</td>
          <td class="p-2 text-right font-bold text-blue-600">${row.normalized_value.toLocaleString()} ${row.unit}</td>
          <td class="p-2 text-slate-400 font-mono text-[10px]">${row.source_observed_at}</td>
        `;
        tbody.appendChild(tr);
      });

      updateChart(dates, dates.map(d => historyData[d].normalized_value));
    }

    function updateChart(labels, data) {
      const ctx = document.getElementById('priceChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '배추 정규화 가격',
            data: data,
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.1)',
            fill: true,
            tension: 0.1
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // --- 웹 첨부파일 업로드 시뮬레이션 핸들러 ---
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-blue-500'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-blue-500'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-blue-500');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const json = JSON.parse(e.target.result);
          if (json.error_code && json.error_code !== 'none') {
            appState = { status: 'stale', error_code: json.error_code };
          } else {
            const date = json.observed_at ? json.observed_at.split('T')[0] : '2026-09-09';
            historyData[date] = {
              signal_id: json.signal_id || 'UPLOADED-FILE',
              source_url: file.name,
              source_observed_at: json.observed_at || new Date().toISOString(),
              normalized_value: json.value !== undefined ? json.value : json.normalized_value,
              unit: json.unit || '원',
              record_date: date
            };
            appState = { status: 'fresh', error_code: 'none' };
          }
          renderUI();
        } catch (err) {
          alert('JSON 파일 해석 실패');
        }
      };
      reader.readAsText(file);
    }

    init();
  </script>
</body>
</html>

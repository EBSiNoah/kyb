<script>
    // 전역 데이터 상태
    let rawHistoryData = {};
    let filteredHistoryData = {};
    let statusData = { status: "fresh", error_code: "none", last_observed_at: "-" };
    let priceChart = null;

    // 날짜 포맷 정규화 헬퍼 함수 (YYYY-MM-DD 추출)
    function parseDateString(item, defaultKey = null) {
        if (typeof item === 'string') {
            const match = item.match(/\d{4}-\d{2}-\d{2}/);
            return match ? match[0] : null;
        }
        const rawDate = item?.record_date || item?.date || item?.observed_at || item?.source_observed_at || defaultKey;
        if (!rawDate) return new Date().toISOString().split('T')[0];
        
        const match = String(rawDate).match(/\d{4}-\d{2}-\d{2}/);
        return match ? match[0] : new Date().toISOString().split('T')[0];
    }

    // 페이지 로드 시 초기화
    window.addEventListener('DOMContentLoaded', () => {
        initChart();
        setupDropzone();
        loadAllData();
    });

    // 1. JSON 데이터 로드 (Status & History)
    async function loadAllData() {
        try {
            const [statusRes, historyRes] = await Promise.all([
                fetch('./data/status.json').catch(() => null),
                fetch('./data/history.json').catch(() => null)
            ]);

            if (statusRes && statusRes.ok) {
                statusData = await statusRes.json();
            }
            if (historyRes && historyRes.ok) {
                const data = await historyRes.json();
                rawHistoryData = {};
                // 날짜 키 정규화
                Object.keys(data).forEach(key => {
                    const item = data[key];
                    const cleanDate = parseDateString(item, key);
                    rawHistoryData[cleanDate] = {
                        ...item,
                        record_date: cleanDate
                    };
                });
            }
        } catch (err) {
            console.warn('데이터 로드 실패 (기본값 사용):', err);
        }

        setDefaultDates();
        applyDateFilter();
        renderStatus();
    }

    // 2. 시작/종료 날짜 기본값 자동 설정
    function setDefaultDates() {
        const dates = Object.keys(rawHistoryData).sort();
        if (dates.length > 0) {
            document.getElementById('start-date').value = dates[0];
            document.getElementById('end-date').value = dates[dates.length - 1];
        } else {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('start-date').value = today;
            document.getElementById('end-date').value = today;
        }
    }

    // 3. 날짜 필터 적용 로직
    function applyDateFilter() {
        const startDate = document.getElementById('start-date').value;
        const endDate = document.getElementById('end-date').value;

        filteredHistoryData = {};

        Object.keys(rawHistoryData).sort().forEach(date => {
            if ((!startDate || date >= startDate) && (!endDate || date <= endDate)) {
                filteredHistoryData[date] = rawHistoryData[date];
            }
        });

        renderDashboard();
    }

    // 4. 날짜 필터 초기화 (전체보기)
    function resetDateFilter() {
        setDefaultDates();
        applyDateFilter();
    }

    // 5. 대시보드 렌더링
    function renderDashboard() {
        const sortedDates = Object.keys(filteredHistoryData).sort();
        const tableBody = document.getElementById('data-table-body');

        if (sortedDates.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" class="empty-msg">해당 기간의 데이터가 존재하지 않습니다.</td></tr>';
            updateMetrics([], []);
            updateChart([], []);
            return;
        }

        tableBody.innerHTML = '';
        const prices = [];
        
        [...sortedDates].reverse().forEach(date => {
            const item = filteredHistoryData[date];
            const val = item.normalized_value ?? item.value ?? item.price ?? 0;
            prices.push(Number(val));

            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${item.record_date || date}</strong></td>
                <td>${Number(val).toLocaleString()} 원</td>
                <td>${item.unit || '원'}</td>
                <td><code>${item.signal_id || 'T04-CABBAGE'}</code></td>
            `;
            tableBody.appendChild(row);
        });

        const chartPrices = sortedDates.map(d => {
            const item = filteredHistoryData[d];
            return Number(item.normalized_value ?? item.value ?? item.price ?? 0);
        });

        updateMetrics(sortedDates, chartPrices);
        updateChart(sortedDates, chartPrices);
    }

    // 6. 상단 지표 계산 및 업데이트
    function updateMetrics(sortedDates, prices) {
        if (prices.length === 0) {
            document.getElementById('metric-current-price').innerText = '- 원';
            document.getElementById('metric-diff').innerText = '전일 대비 -';
            document.getElementById('metric-avg-price').innerText = '- 원';
            document.getElementById('metric-range').innerText = '- / -';
            return;
        }

        const latestPrice = prices[prices.length - 1];
        document.getElementById('metric-current-price').innerText = `${latestPrice.toLocaleString()} 원`;

        const diffElem = document.getElementById('metric-diff');
        if (prices.length > 1) {
            const prevPrice = prices[prices.length - 2];
            const diff = latestPrice - prevPrice;
            if (diff > 0) {
                diffElem.className = 'metric-sub up';
                diffElem.innerText = `▲ 전일 대비 +${diff.toLocaleString()}원`;
            } else if (diff < 0) {
                diffElem.className = 'metric-sub down';
                diffElem.innerText = `▼ 전일 대비 ${diff.toLocaleString()}원`;
            } else {
                diffElem.className = 'metric-sub neutral';
                diffElem.innerText = `─ 전일과 동일`;
            }
        } else {
            diffElem.className = 'metric-sub neutral';
            diffElem.innerText = `비교 데이터 없음`;
        }

        const sum = prices.reduce((acc, curr) => acc + curr, 0);
        const avg = Math.round(sum / prices.length);
        document.getElementById('metric-avg-price').innerText = `${avg.toLocaleString()} 원`;

        const max = Math.max(...prices);
        const min = Math.min(...prices);
        document.getElementById('metric-range').innerText = `${max.toLocaleString()}원 / ${min.toLocaleString()}원`;
    }

    // 7. 상태 배지 렌더링
    function renderStatus() {
        const badge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const lastObserved = document.getElementById('last-observed');
        const errorCodeElem = document.getElementById('metric-error-code');

        if (statusData.status === 'fresh') {
            badge.className = 'status-badge fresh';
            statusText.innerText = 'FRESH';
        } else {
            badge.className = 'status-badge stale';
            statusText.innerText = 'STALE';
        }

        lastObserved.innerText = `최신 관측 시각: ${statusData.last_observed_at || '-'}`;
        errorCodeElem.innerText = statusData.error_code || 'none';
    }

    // 8. Chart.js 그래프 초기화 및 업데이트
    function initChart() {
        const ctx = document.getElementById('priceChart').getContext('2d');
        priceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: '배추 시세 (원)',
                    data: [],
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 5,
                    pointHoverRadius: 7
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false } },
                    y: {
                        beginAtZero: false,
                        ticks: { callback: value => value.toLocaleString() + '원' }
                    }
                }
            }
        });
    }

    function updateChart(labels, data) {
        if (!priceChart) return;
        priceChart.data.labels = labels;
        priceChart.data.datasets[0].data = data;
        priceChart.update();
    }

    // 9. Fixture 드롭존 설정
    function setupDropzone() {
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');

        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });
    }

    // 드롭된 JSON 파싱
    function handleFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const json = JSON.parse(e.target.result);

                if (json.status === 'stale' || json.error_code) {
                    statusData.status = 'stale';
                    statusData.error_code = json.error_code || 'error';
                    alert(`[시뮬레이션] 에러 Fixture 수신\n상태: STALE, 에러코드: ${statusData.error_code}`);
                } else {
                    statusData.status = 'fresh';
                    statusData.error_code = 'none';
                    statusData.last_observed_at = new Date().toISOString();

                    const recordDate = parseDateString(json);
                    const val = json.normalized_value ?? json.value ?? json.price ?? 0;

                    rawHistoryData[recordDate] = {
                        signal_id: json.signal_id || 'T04-CABBAGE',
                        normalized_value: Number(val),
                        unit: json.unit || '원',
                        record_date: recordDate
                    };

                    alert(`[시뮬레이션] 정상 Fixture 수신\n날짜: ${recordDate}, 가격: ${val}원`);
                }

                renderStatus();
                setDefaultDates();
                applyDateFilter();
            } catch (err) {
                alert('유효하지 않은 JSON 파일입니다.');
            }
        };
        reader.readAsText(file);
    }
</script>

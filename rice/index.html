<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경매 정보 수집 현황</title>
  <style>
    body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
    .container { max-width: 800px; margin: 0 auto; }
    input, button { padding: 8px 12px; margin-right: 5px; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🌾 공영도매시장 경매 데이터 수집 페이지</h2>

    <div style="margin-bottom: 20px;">
      <label for="dateInput">수집 일자 조회: </label>
      <input type="date" id="dateInput">
      <button onclick="loadSavedData()">저장된 데이터 불러오기</button>
    </div>

    <h3>표준 JSON 결과 (`status`, `stored_value`, `record_date`, `deadline_ms`, `source_url`)</h3>
    <pre id="result">날짜를 선택하고 버튼을 누르세요.</pre>
  </div>

  <script>
    // 오늘 날짜로 초기화
    document.getElementById('dateInput').value = new Date().toISOString().substring(0, 10);

    async function loadSavedData() {
      const selectedDate = document.getElementById('dateInput').value;
      const resultEl = document.getElementById('result');
      
      // rice/data/auction_YYYY-MM-DD.json 파일 경로 접근
      const filePath = `./data/auction_${selectedDate}.json`;
      resultEl.textContent = "데이터 불러오는 중...";

      try {
        const response = await fetch(filePath);
        if (!response.ok) {
          throw new Error(`해당 날짜(${selectedDate})의 저장된 데이터가 없습니다.`);
        }
        const data = await response.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = err.message;
      }
    }
  </script>
</body>
</html>

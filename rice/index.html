<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>엔화 환율 데이터 기간별 조회</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f8f9fa; color: #333; }
    .container { max-width: 950px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #2c3e50; }
    
    .section-box { background: #eef2f5; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
    .section-title { font-weight: bold; margin-bottom: 10px; color: #495057; }
    
    .filter-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    input[type="date"], input[type="file"] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; background: white; }
    
    button { padding: 7px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0056b3; }

    .chart-container { position: relative; width: 100%; height: 380px; margin-top: 15px; }
    #statusMsg { font-weight: bold; color: #495057; margin-top: 10px; }

    .table-wrap { margin-top: 20px; overflow-x: auto; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.data-table th, table.data-table td { padding: 8px 10px; border-bottom: 1px solid #e9ecef; text-align: left; white-space: nowrap; }
    table.data-table th { background: #eef2f5; color: #495057; position: sticky; top: 0; }
    table.data-table tbody tr:hover { background: #f8f9fa; }
    table.data-table td a { color: #007bff; text-decoration: none; }
    table.data-table td a:hover { text-decoration: underline; }

    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .status-dot.ok { background: #28a745; }
    .status-dot.bad { background: #d9534f; }
    .status-cell { white-space: nowrap; font-weight: bold; }
    .status-cell.ok-text { color: #28a745; }
    .status-cell.bad-text { color: #d9534f; }

  </style>
</head>
<body>
  <div class="container">
    <h2>💴 엔화(JPY) 환율 데이터 기간별 조회</h2>

    <!-- 1. 기간 조회 구역 -->
    <div class="section-box">
      <div class="section-title">📅 1. 기간 조회</div>
      <div class="filter-box">
        <label for="startDate">시작일:</label>
        <input type="date" id="startDate" min="2025-01-01">
        
        <label for="endDate">종료일:</label>
        <input type="date" id="endDate" min="2025-01-01">

        <button onclick="loadAndDrawChart()">구간 조회</button>
      </div>
      <div style="font-size: 12px; color: #6c757d; margin-top: 6px;">
        * 최소 조회 날짜: <strong>2025-01-01</strong> | * 최대 조회 구간: <strong>1개월(31일)</strong>
      </div>
    </div>

    <!-- 2. 로컬 JSON 파일 첨부 구역 -->
    <div class="section-box">
      <div class="section-title">📁 2. 로컬 JSON 파일 첨부하기</div>
      <div class="filter-box">
        <input type="file" id="fileInput" accept=".json" multiple onchange="handleFileUpload(event)">
      </div>
    </div>

    <div id="statusMsg">날짜 범위를 지정하고 [구간 조회] 버튼을 누르세요.</div>

    <!-- 그래프 영역 -->
    <div class="chart-container">
      <canvas id="valueChart"></canvas>
    </div>

    <!-- 필드별 데이터 목록 -->
    <h4 style="margin-bottom: 6px; color: #2c3e50;">📋 데이터 목록 (상태등 / source_time / status / stored_value / delay_ms / source_url)</h4>
    <div class="table-wrap" id="dataTableContainer">
      <p style="color:#868e96; font-size:13px;">조회하거나 파일을 첨부하면 여기에 표시됩니다.</p>
    </div>
  </div>

  <script>
    let myChart = null;
    const MIN_DATE = "2025-01-01";

    // 현재 그래프/표에 표시 중인 전체 데이터 (구간 조회 결과 + 첨부파일로 추가된 데이터가 함께 누적됩니다)
    let currentPoints = [];

    // 날짜별 데이터 캐시: 저장소(repo)에는 저장되지 않고, 이 탭을 열어둔 세션 동안만 메모리에 유지됩니다.
    // (새로고침하면 초기화됩니다.)
    const sessionDataCache = {};

    function cacheStandardPoints(items) {
      const byDate = {};
      items.forEach(item => {
        const d = item.source_time;
        if (!d) return;
        if (!byDate[d]) byDate[d] = [];
        byDate[d].push(item);
      });
      // 새로 들어온 날짜의 데이터로 해당 날짜의 캐시를 갱신(교체)합니다.
      Object.keys(byDate).forEach(d => {
        sessionDataCache[d] = byDate[d];
      });
    }

    // newPoints를 currentPoints(현재 화면에 표시 중인 데이터)에 병합하고 다시 그립니다.
    // newPoints에 포함된 날짜는 기존 currentPoints의 같은 날짜 데이터를 덮어씁니다(교체).
    function mergeIntoCurrentView(newPoints, titleLabel) {
      const incomingDates = new Set(newPoints.map(p => p.source_time));
      // 같은 날짜의 기존 데이터는 제거하고 새 데이터로 교체
      currentPoints = currentPoints.filter(p => !incomingDates.has(p.source_time));
      currentPoints.push(...newPoints);
      renderChart(currentPoints, titleLabel);
      renderDataTable(currentPoints);
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return '-';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // status가 1 또는 200이면 정상. 정상이더라도 화면에 표시해야 하는 5개 필드
    // (status, stored_value, source_time, delay_ms, source_url) 중 하나라도 null/undefined면 비정상으로 처리합니다.
    function isNormalItem(item) {
      if (!item) return false;

      const statusOk = item.status === 1 || item.status === '1' || item.status === 200 || item.status === '200';
      if (!statusOk) return false;

      const requiredFields = ['status', 'stored_value', 'source_time', 'delay_ms', 'source_url'];
      return requiredFields.every(f => item[f] !== null && item[f] !== undefined);
    }

    function renderDataTable(items) {
      const container = document.getElementById('dataTableContainer');
      if (!items || items.length === 0) {
        container.innerHTML = '<p style="color:#868e96; font-size:13px;">표시할 데이터가 없습니다.</p>';
        return;
      }

      const sorted = [...items].sort((a, b) => new Date(a.source_time) - new Date(b.source_time));

      const rows = sorted.map(item => {
        const url = item.source_url;
        const isSafeUrl = typeof url === 'string' && /^https?:\/\//i.test(url);
        const urlCell = isSafeUrl
          ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">링크</a>`
          : escapeHtml(url);
        const ok = isNormalItem(item);
        const dotClass = ok ? 'ok' : 'bad';
        const textClass = ok ? 'ok-text' : 'bad-text';
        const label = ok ? '정상' : '비정상';
        return `
          <tr>
            <td class="status-cell ${textClass}"><span class="status-dot ${dotClass}"></span>${label}</td>
            <td>${escapeHtml(item.source_time)}</td>
            <td>${escapeHtml(item.status)}</td>
            <td>${escapeHtml(item.stored_value)}</td>
            <td>${escapeHtml(item.delay_ms)}</td>
            <td>${urlCell}</td>
          </tr>`;
      }).join('');

      container.innerHTML = `
        <table class="data-table">
          <thead>
            <tr>
              <th>상태</th>
              <th>source_time</th>
              <th>status</th>
              <th>stored_value</th>
              <th>delay_ms</th>
              <th>source_url</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    window.onload = () => {
      const today = new Date();
      const lastWeek = new Date();
      lastWeek.setDate(today.getDate() - 7);

      document.getElementById('endDate').value = today.toISOString().substring(0, 10);
      document.getElementById('startDate').value = lastWeek.toISOString().substring(0, 10);
    };

    // source_time 값에서 앞의 YYYY-MM-DD 부분만 인식합니다.
    // (예: "2026-08-27T10:32:00" 또는 "2026-08-27 10:32:00" -> "2026-08-27")
    // 패턴에 맞지 않으면 원래 값을 그대로 반환합니다.
    function toDateOnly(value) {
      if (value === null || value === undefined) return value;
      const match = String(value).match(/^\d{4}-\d{2}-\d{2}/);
      return match ? match[0] : value;
    }

    function parseToStandardFormat(rawData) {
      let result = [];
      if (rawData.payload || rawData.transport || rawData.expected) {
        result.push({
          status: rawData.transport?.status ?? null,
          stored_value: rawData.expected?.stored_value ?? null,
          source_time: toDateOnly(rawData.payload?.source_time ?? rawData.expected?.source_time ?? null),
          delay_ms: rawData.transport?.delay_ms ?? null,
          source_url: rawData.payload?.source_url ?? null
        });
      } else if (Array.isArray(rawData)) {
        result = rawData.map(item => ({ ...item, source_time: toDateOnly(item.source_time) }));
      }
      return result;
    }

    // 메인 기간 조회 제어
    async function loadAndDrawChart() {
      const startDateStr = document.getElementById('startDate').value;
      const endDateStr = document.getElementById('endDate').value;
      const statusMsg = document.getElementById('statusMsg');

      if (!startDateStr || !endDateStr) return alert("시작일과 종료일을 선택하세요.");

      if (startDateStr < MIN_DATE || endDateStr < MIN_DATE) {
        return alert(`2025년 1월 1일 이전 데이터는 조회할 수 없습니다. (최소: ${MIN_DATE})`);
      }

      if (startDateStr > endDateStr) {
        return alert("시작일은 종료일보다 이전이어야 합니다.");
      }

      const start = new Date(startDateStr);
      const end = new Date(endDateStr);
      const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;

      if (diffDays > 31) {
        return alert(`조회 구간은 최대 1개월(31일)까지로 제한됩니다. (현재 선택: ${diffDays}일)`);
      }

      statusMsg.textContent = "저장된 데이터 파일 확인 중...";

      const targetDates = getDateRange(startDateStr, endDateStr);
      let allStandardPoints = [];
      let missingDates = [];

      // 세션 캐시 → 없으면 저장소 데이터 파일 확인
      const fetchPromises = targetDates.map(async (dateStr) => {
        if (sessionDataCache[dateStr]) {
          return sessionDataCache[dateStr];
        }
        try {
          const res = await fetch(`./data/auction_${dateStr}.json`);
          if (res.ok) {
            const data = await res.json();
            const items = parseToStandardFormat(data);
            sessionDataCache[dateStr] = items; // 세션 동안 기억
            return items;
          } else {
            missingDates.push(dateStr);
            return [];
          }
        } catch (e) {
          missingDates.push(dateStr);
          return [];
        }
      });

      const results = await Promise.all(fetchPromises);
      results.forEach(items => {
        if (items) allStandardPoints.push(...items);
      });

      if (allStandardPoints.length === 0) {
        statusMsg.innerHTML = `<span style="color:#d9534f;">⚠️ 선택한 기간의 수집된 데이터가 없습니다.</span><br>` +
                              `<small>(누락된 날짜: ${missingDates.join(', ')} — GitHub Actions 워크플로우를 수동으로 실행하거나, 스케줄 실행을 기다려 주세요. 또는 아래에서 해당 날짜의 JSON 파일을 첨부하면 그래프에 바로 반영됩니다.)</small>`;
        if (myChart) myChart.destroy();
        currentPoints = [];
        renderDataTable([]);
        return;
      }

      currentPoints = allStandardPoints;
      renderChart(currentPoints, `조회 구간: ${startDateStr} ~ ${endDateStr}`);
      renderDataTable(currentPoints);

      const normalCount = currentPoints.filter(isNormalItem).length;
      const abnormalCount = currentPoints.length - normalCount;
      const statusSummary = `정상 ${normalCount}건 / 비정상 ${abnormalCount}건 (그래프에는 정상 데이터만 반영됨)`;

      if (missingDates.length > 0) {
        statusMsg.textContent = `조회 완료: ${allStandardPoints.length}건 표시됨 (${statusSummary}) · 누락된 날짜 ${missingDates.length}일: ${missingDates.join(', ')}`;
      } else {
        statusMsg.textContent = `조회 완료: 총 ${allStandardPoints.length}건의 데이터를 로드했습니다 (${statusSummary})`;
      }
    }

    function getDateRange(startStr, endStr) {
      const dates = [];
      let current = new Date(startStr);
      const last = new Date(endStr);
      while (current <= last) {
        dates.push(current.toISOString().substring(0, 10));
        current.setDate(current.getDate() + 1);
      }
      return dates;
    }

    async function handleFileUpload(event) {
      const files = event.target.files;
      const statusMsg = document.getElementById('statusMsg');

      if (!files || files.length === 0) return;

      let allPoints = [];
      for (let file of files) {
        try {
          const text = await file.text();
          const json = JSON.parse(text);
          allPoints.push(...parseToStandardFormat(json));
        } catch (err) {
          console.error("파일 해석 에러:", err);
        }
      }

      cacheStandardPoints(allPoints);
      mergeIntoCurrentView(allPoints, "구간 조회 + 첨부파일 데이터");
      const normalCount = currentPoints.filter(isNormalItem).length;
      const abnormalCount = currentPoints.length - normalCount;
      statusMsg.textContent = `첨부파일로부터 ${allPoints.length}건을 추가했습니다. (현재 그래프에 반영됨, 총 ${currentPoints.length}건 · 정상 ${normalCount}건 / 비정상 ${abnormalCount}건 · 날짜별로 세션 동안 기억됩니다)`;
    }

    function renderChart(standardDataList, titleLabel) {
      // 그래프에는 "정상"으로 판정된 데이터만 반영합니다 (비정상 데이터는 표에서만 확인 가능)
      const normalList = standardDataList.filter(isNormalItem);
      normalList.sort((a, b) => new Date(a.source_time) - new Date(b.source_time));

      const labels = normalList.map(item => item.source_time ?? 'N/A');
      const values = normalList.map(item => item.stored_value ?? 0);

      if (myChart) myChart.destroy();

      const ctx = document.getElementById('valueChart').getContext('2d');
      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `stored_value (${titleLabel})`,
            data: values,
            borderColor: '#007bff',
            backgroundColor: 'rgba(0, 123, 255, 0.15)',
            borderWidth: 2,
            pointRadius: 4,
            fill: true,
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: '기록 일시 (source_time)' } },
            y: { title: { display: true, text: '저장 값 (stored_value = TTB 전신환 받으실때 환율)' } }
          }
        }
      });
    }
  </script>
</body>
</html>

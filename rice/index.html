<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경매 데이터 추이 시각화 & JSON 첨부</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f8f9fa; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #2c3e50; }
    
    .section-box { background: #eef2f5; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
    .section-title { font-weight: bold; margin-bottom: 10px; color: #495057; }
    
    .filter-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    input[type="date"], input[type="file"] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; background: white; }
    
    button { padding: 7px 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #218838; }
    
    .chart-container { position: relative; width: 100%; height: 380px; margin-top: 15px; }
    #statusMsg { font-weight: bold; color: #495057; margin-top: 10px; }
    pre { background: #f1f3f5; padding: 12px; border-radius: 5px; font-size: 12px; max-height: 150px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🌾 경매/테스트 데이터 시각화 리포트</h2>

    <!-- 방식 1: 첨부파일 직접 선택 (normal-d1-b.json 형태 지원) -->
    <div class="section-box">
      <div class="section-title">📁 1. 로컬 JSON 파일 첨부하기 (단일/다중 파일)</div>
      <div class="filter-box">
        <input type="file" id="fileInput" accept=".json" multiple onchange="handleFileUpload(event)">
        <span style="font-size: 13px; color: #6c757d;">* normal-d1-b.json 형태의 파일을 직접 선택하세요.</span>
      </div>
    </div>

    <!-- 방식 2: 서버에 저장된 날짜 구간별 데이터 자동 조회 -->
    <div class="section-box">
      <div class="section-title">📅 2. 서버 저장 데이터 기간 조회</div>
      <div class="filter-box">
        <label for="startDate">시작일:</label>
        <input type="date" id="startDate">
        
        <label for="endDate">종료일:</label>
        <input type="date" id="endDate">

        <button onclick="loadAndDrawChart()">구간 조회</button>
      </div>
    </div>

    <div id="statusMsg">파일을 첨부하거나 날짜 범위를 선택하세요.</div>

    <!-- 그래프 출력 영역 -->
    <div class="chart-container">
      <canvas id="valueChart"></canvas>
    </div>

    <!-- 표준 변환 데이터 미리보기 -->
    <h4>📌 추출 및 매핑된 표준 JSON 데이터</h4>
    <pre id="jsonPreview">데이터가 로드되면 여기에 표시됩니다.</pre>
  </div>

  <script>
    let myChart = null;

    // 초기 날짜 세팅
    window.onload = () => {
      const today = new Date();
      const lastWeek = new Date();
      lastWeek.setDate(today.getDate() - 7);

      document.getElementById('endDate').value = today.toISOString().substring(0, 10);
      document.getElementById('startDate').value = lastWeek.toISOString().substring(0, 10);
    };

    // [핵심] 수신된 raw JSON 객체를 5개 표준 규격으로 매핑해주는 규격화 함수
    function parseToStandardFormat(rawData) {
      let result = [];

      // 케이스 A: normal-d1-b.json 구조인 경우 (payload, transport, expected 보유)
      if (rawData.payload || rawData.transport || rawData.expected) {
        result.push({
          status: rawData.transport?.status ?? null,
          stored_value: rawData.expected?.stored_value ?? null,
          record_date: rawData.payload?.record_date ?? rawData.expected?.record_date ?? null,
          deadline_ms: rawData.transport?.deadline_ms ?? null,
          source_url: rawData.payload?.source_url ?? null
        });
      }
      // 케이스 B: 공공데이터 API 응답 형태인 경우 (header / body)
      else if (rawData.header && rawData.body) {
        const resultCode = rawData.header.resultCode;
        const items = rawData.body.items || [];
        items.forEach(item => {
          result.push({
            status: resultCode,
            stored_value: item.scsbd_prc ? parseFloat(item.scsbd_prc) : null,
            record_date: item.scsbd_dt,
            deadline_ms: null,
            source_url: "https://apis.data.go.kr/B552845/katRealTime2/trades2"
          });
        });
      }
      // 케이스 C: 이미 표준 규격 배열([]) 형태로 저장되어 있는 경우
      else if (Array.isArray(rawData)) {
        result = rawData;
      }

      return result;
    }

    // 1. 웹 첨부파일(JSON) 읽기 및 처리 함수
    async function handleFileUpload(event) {
      const files = event.target.files;
      const statusMsg = document.getElementById('statusMsg');
      const jsonPreview = document.getElementById('jsonPreview');

      if (!files || files.length === 0) return;

      statusMsg.textContent = `${files.length}개의 파일을 읽는 중...`;
      let allStandardPoints = [];

      for (let file of files) {
        try {
          const text = await file.text();
          const json = JSON.parse(text);
          const standardizedList = parseToStandardFormat(json);
          allStandardPoints.push(...standardizedList);
        } catch (err) {
          console.error(`파일 읽기 오류 (${file.name}):`, err);
        }
      }

      if (allStandardPoints.length === 0) {
        statusMsg.textContent = "유효한 JSON 데이터를 찾을 수 없습니다.";
        return;
      }

      jsonPreview.textContent = JSON.stringify(allStandardPoints, null, 2);
      renderChart(allStandardPoints, `첨부파일 데이터 (${allStandardPoints.length}건)`);
      statusMsg.textContent = `첨부된 파일로부터 총 ${allStandardPoints.length}건의 데이터를 성공적으로 로드했습니다.`;
    }

    // 2. 서버 저장 파일 기간별 동적 불러오기 함수
    async function loadAndDrawChart() {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const statusMsg = document.getElementById('statusMsg');
      const jsonPreview = document.getElementById('jsonPreview');

      if (!startDate || !endDate) return alert("날짜를 선택하세요.");

      statusMsg.textContent = "서버 데이터 조회 중...";
      
      const targetDates = getDateRange(startDate, endDate);
      let allStandardPoints = [];

      const promises = targetDates.map(dateStr => 
        fetch(`./data/auction_${dateStr}.json`)
          .then(res => res.ok ? res.json() : null)
          .catch(() => null)
      );

      const results = await Promise.all(promises);

      results.forEach(data => {
        if (data) {
          const standardized = parseToStandardFormat(data);
          allStandardPoints.push(...standardized);
        }
      });

      if (allStandardPoints.length === 0) {
        statusMsg.textContent = "해당 기간에 저장된 데이터가 없습니다.";
        if (myChart) myChart.destroy();
        jsonPreview.textContent = "데이터 없음";
        return;
      }

      jsonPreview.textContent = JSON.stringify(allStandardPoints, null, 2);
      renderChart(allStandardPoints, `서버 데이터 (${startDate} ~ ${endDate})`);
      statusMsg.textContent = `총 ${allStandardPoints.length}건의 데이터를 조회했습니다.`;
    }

    // 날짜 구간 배열 생성 함수
    function getDateRange(start, end) {
      const dates = [];
      let current = new Date(start);
      const last = new Date(end);
      while (current <= last) {
        dates.push(current.toISOString().substring(0, 10));
        current.setDate(current.getDate() + 1);
      }
      return dates;
    }

    // 3. Chart.js 렌더링 함수
    function renderChart(standardDataList, titleLabel) {
      // 시간순 오름차순 정렬
      standardDataList.sort((a, b) => new Date(a.record_date) - new Date(b.record_date));

      const labels = standardDataList.map(item => item.record_date ?? 'N/A');
      const values = standardDataList.map(item => item.stored_value ?? 0);

      if (myChart) myChart.destroy();

      const ctx = document.getElementById('valueChart').getContext('2d');
      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `stored_value (${titleLabel})`,
            data: values,
            borderColor: '#28a745',
            backgroundColor: 'rgba(40, 167, 69, 0.15)',
            borderWidth: 2,
            pointRadius: 5,
            fill: true,
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: '기록 일시 (record_date)' } },
            y: { title: { display: true, text: '저장 값 (stored_value)' } }
          }
        }
      });
    }
  </script>
</body>
</html>

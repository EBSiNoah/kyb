<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경매 데이터 추이 시각화 & 실시간 조회</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f8f9fa; color: #333; }
    .container { max-width: 950px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #2c3e50; }
    
    .section-box { background: #eef2f5; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
    .section-title { font-weight: bold; margin-bottom: 10px; color: #495057; }
    
    .filter-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    input[type="date"], input[type="text"], input[type="file"] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; background: white; }
    
    button { padding: 7px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    
    .chart-container { position: relative; width: 100%; height: 380px; margin-top: 15px; }
    #statusMsg { font-weight: bold; color: #495057; margin-top: 10px; }
    pre { background: #f1f3f5; padding: 12px; border-radius: 5px; font-size: 12px; max-height: 150px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🌾 경매 데이터 기간별 조회 & 시각화</h2>

    <!-- 방식 1: 서버 저장 파일 조회 + 없는 데이터 실시간 API 호출 -->
    <div class="section-box">
      <div class="section-title">📅 1. 기간 조회 (서버 데이터 + 미존재 시 실시간 API 호출)</div>
      <div class="filter-box">
        <label for="startDate">시작일:</label>
        <input type="date" id="startDate" min="2025-01-01">
        
        <label for="endDate">종료일:</label>
        <input type="date" id="endDate" min="2025-01-01">

        <label for="apiKeyInput">API Key (실시간 호출용):</label>
        <input type="text" id="apiKeyInput" placeholder="필요시 인증키 입력">

        <button onclick="loadAndDrawChart()">구간 조회</button>
      </div>
      <div style="font-size: 12px; color: #6c757d; margin-top: 6px;">
        * 최소 조회 가능 날짜: <strong>2025-01-01</strong> | * 최대 조회 구간: <strong>최대 1개월(31일)</strong>
      </div>
    </div>

    <!-- 방식 2: 첨부파일 직접 선택 (normal-d1-b.json 등) -->
    <div class="section-box">
      <div class="section-title">📁 2. 로컬 JSON 파일 첨부하기</div>
      <div class="filter-box">
        <input type="file" id="fileInput" accept=".json" multiple onchange="handleFileUpload(event)">
      </div>
    </div>

    <div id="statusMsg">날짜 범위를 지정하고 [구간 조회] 버튼을 누르세요.</div>

    <!-- 그래프 영역 -->
    <div class="chart-container">
      <canvas id="valueChart"></canvas>
    </div>

    <!-- 추출/매핑 결과 미리보기 -->
    <h4>📌 추출 및 매핑된 표준 JSON 데이터</h4>
    <pre id="jsonPreview">데이터가 로드되면 여기에 표시됩니다.</pre>
  </div>

  <script>
    let myChart = null;
    const MIN_DATE = "2025-01-01";
    const BASE_URL = "https://apis.data.go.kr/B552845/katRealTime2/trades2";

    window.onload = () => {
      const today = new Date();
      const lastWeek = new Date();
      lastWeek.setDate(today.getDate() - 7);

      document.getElementById('endDate').value = today.toISOString().substring(0, 10);
      document.getElementById('startDate').value = lastWeek.toISOString().substring(0, 10);
    };

    // 공통 규격 매핑 파서
    function parseToStandardFormat(rawData, fallbackSourceUrl = BASE_URL, fallbackDeadlineMs = null) {
      let result = [];

      if (rawData.payload || rawData.transport || rawData.expected) {
        result.push({
          status: rawData.transport?.status ?? null,
          stored_value: rawData.expected?.stored_value ?? null,
          record_date: rawData.payload?.record_date ?? rawData.expected?.record_date ?? null,
          deadline_ms: rawData.transport?.deadline_ms ?? null,
          source_url: rawData.payload?.source_url ?? fallbackSourceUrl
        });
      } else if (rawData.header && rawData.body) {
        const resultCode = rawData.header.resultCode;
        const items = rawData.body.items || [];
        items.forEach(item => {
          result.push({
            status: resultCode,
            stored_value: item.scsbd_prc ? parseFloat(item.scsbd_prc) : null,
            record_date: item.scsbd_dt,
            deadline_ms: fallbackDeadlineMs,
            source_url: fallbackSourceUrl
          });
        });
      } else if (Array.isArray(rawData)) {
        result = rawData;
      }

      return result;
    }

    // [핵심] 실시간 API 호출 함수 (10초 타임아웃 적용)
    async function fetchApiRealtime(dateStr, apiKey) {
      if (!apiKey) {
        console.warn(`[${dateStr}] 저장된 파일이 없으나 API Key가 제공되지 않았습니다.`);
        return null;
      }

      const params = new URLSearchParams({
        serviceKey: apiKey,
        "cond[trd_clcln_ymd::EQ]": dateStr,
        returnType: "JSON",
        numOfRows: "100",
        pageNo: "1"
      });

      const fullUrl = `${BASE_URL}?${params.toString()}`;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);
      const startTime = performance.now();

      try {
        const response = await fetch(fullUrl, { signal: controller.signal });
        const endTime = performance.now();
        clearTimeout(timeoutId);

        if (!response.ok) return null;

        const deadlineMs = Math.round(endTime - startTime);
        const json = await response.json();
        return parseToStandardFormat(json, BASE_URL, deadlineMs);
      } catch (err) {
        clearTimeout(timeoutId);
        console.error(`[${dateStr}] 실시간 API 호출 실패:`, err.message);
        return null;
      }
    }

    // 1. 기간 조회 및 동적 복구(저장소 ➔ API fallback)
    async function loadAndDrawChart() {
      const startDateStr = document.getElementById('startDate').value;
      const endDateStr = document.getElementById('endDate').value;
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      const statusMsg = document.getElementById('statusMsg');
      const jsonPreview = document.getElementById('jsonPreview');

      if (!startDateStr || !endDateStr) return alert("시작일과 종료일을 입력해주세요.");

      // 제한 조건 1: 최대 2025-01-01 까지
      if (startDateStr < MIN_DATE || endDateStr < MIN_DATE) {
        return alert(`2025년 1월 1일 이전 데이터는 조회할 수 없습니다. (최소: ${MIN_DATE})`);
      }

      if (startDateStr > endDateStr) {
        return alert("시작일은 종료일보다 이전이어야 합니다.");
      }

      // 제한 조건 2: 구간 최대 1개월 (31일)
      const start = new Date(startDateStr);
      const end = new Date(endDateStr);
      const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;

      if (diffDays > 31) {
        return alert(`조회 구간은 최대 1개월(31일)까지로 제한됩니다. (현재 선택: ${diffDays}일)`);
      }

      statusMsg.textContent = "데이터 조회 중... (서버 파일 확인 ➔ 필요시 실시간 API 호출)";

      const targetDates = getDateRange(startDateStr, endDateStr);
      let allStandardPoints = [];
      let realtimeCount = 0;

      // 일자별 순차/동시 처리
      const fetchPromises = targetDates.map(async (dateStr) => {
        // 1단계: 저장소 내 파일 존재 여부 확인
        try {
          const res = await fetch(`./data/auction_${dateStr}.json`);
          if (res.ok) {
            const data = await res.json();
            return parseToStandardFormat(data);
          }
        } catch (e) {
          // 파일 없음 -> 2단계로 이동
        }

        // 2단계: 저장된 파일이 없으면 실시간 API 호출
        realtimeCount++;
        const apiData = await fetchApiRealtime(dateStr, apiKey);
        return apiData || [];
      });

      const results = await Promise.all(fetchPromises);

      results.forEach(items => {
        if (items) allStandardPoints.push(...items);
      });

      if (allStandardPoints.length === 0) {
        statusMsg.textContent = "해당 기간에 조회된 데이터가 없습니다. (API Key를 입력했는지 확인하세요)";
        if (myChart) myChart.destroy();
        jsonPreview.textContent = "데이터 없음";
        return;
      }

      jsonPreview.textContent = JSON.stringify(allStandardPoints, null, 2);
      renderChart(allStandardPoints, `조회 구간: ${startDateStr} ~ ${endDateStr}`);
      
      statusMsg.textContent = `조회 완료: 총 ${allStandardPoints.length}건 데이터 로드됨. (실시간 API 호출: ${realtimeCount}일분)`;
    }

    // 날짜 구간 배열 생성 함수
    function getDateRange(startStr, endStr) {
      const dates = [];
      let current = new Date(startStr);
      const last = new Date(endStr);
      while (current <= last) {
        dates.push(current.toISOString().substring(0, 10));
        current.setDate(current.getDate() + 1);
      }
      return dates;
    }

    // 2. 첨부파일 업로드 처리
    async function handleFileUpload(event) {
      const files = event.target.files;
      const statusMsg = document.getElementById('statusMsg');
      const jsonPreview = document.getElementById('jsonPreview');

      if (!files || files.length === 0) return;

      let allPoints = [];
      for (let file of files) {
        try {
          const text = await file.text();
          const json = JSON.parse(text);
          allPoints.push(...parseToStandardFormat(json));
        } catch (err) {
          console.error("파일 해석 에러:", err);
        }
      }

      jsonPreview.textContent = JSON.stringify(allPoints, null, 2);
      renderChart(allPoints, "첨부파일 로드 데이터");
      statusMsg.textContent = `첨부파일로부터 총 ${allPoints.length}건의 데이터를 로드했습니다.`;
    }

    // 3. Chart.js 렌더링
    function renderChart(standardDataList, titleLabel) {
      standardDataList.sort((a, b) => new Date(a.record_date) - new Date(b.record_date));

      const labels = standardDataList.map(item => item.record_date ?? 'N/A');
      const values = standardDataList.map(item => item.stored_value ?? 0);

      if (myChart) myChart.destroy();

      const ctx = document.getElementById('valueChart').getContext('2d');
      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `stored_value (${titleLabel})`,
            data: values,
            borderColor: '#007bff',
            backgroundColor: 'rgba(0, 123, 255, 0.15)',
            borderWidth: 2,
            pointRadius: 4,
            fill: true,
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: '기록 일시 (record_date)' } },
            y: { title: { display: true, text: '저장 값 (stored_value)' } }
          }
        }
      });
    }
  </script>
</body>
</html>

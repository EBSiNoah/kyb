<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경매 데이터 기간별 조회 & 시각화</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f8f9fa; color: #333; }
    .container { max-width: 950px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #2c3e50; }
    .section-box { background: #eef2f5; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
    .section-title { font-weight: bold; margin-bottom: 10px; color: #495057; }
    .filter-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    input[type="date"], input[type="file"] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; background: white; }
    button { padding: 7px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .chart-container { position: relative; width: 100%; height: 380px; margin-top: 15px; }
    #statusMsg { font-weight: bold; color: #495057; margin-top: 10px; }
    pre { background: #f1f3f5; padding: 12px; border-radius: 5px; font-size: 12px; max-height: 150px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🌾 경매 데이터 기간별 조회 & 시각화</h2>

    <div class="section-box">
      <div class="section-title">📅 1. 기간 조회 (저장소 데이터 기반)</div>
      <div class="filter-box">
        <label for="startDate">시작일:</label>
        <input type="date" id="startDate" min="2025-01-01">
        
        <label for="endDate">종료일:</label>
        <input type="date" id="endDate" min="2025-01-01">

        <button onclick="loadAndDrawChart()">구간 조회</button>
      </div>
      <div style="font-size: 12px; color: #6c757d; margin-top: 6px;">
        * 최소 조회 가능 날짜: <strong>2025-01-01</strong> | * 최대 조회 구간: <strong>최대 1개월(31일)</strong>
      </div>
    </div>

    <div class="section-box">
      <div class="section-title">📁 2. 로컬 JSON 파일 첨부하기 (normal-d1-b.json 등)</div>
      <div class="filter-box">
        <input type="file" id="fileInput" accept=".json" multiple onchange="handleFileUpload(event)">
      </div>
    </div>

    <div id="statusMsg">날짜 범위를 지정하고 [구간 조회] 버튼을 누르세요.</div>

    <div class="chart-container">
      <canvas id="valueChart"></canvas>
    </div>

    <h4>📌 추출 및 매핑된 표준 JSON 데이터</h4>
    <pre id="jsonPreview">데이터가 로드되면 여기에 표시됩니다.</pre>
  </div>

  <script>
    let myChart = null;
    const MIN_DATE = "2025-01-01";

    window.onload = () => {
      const today = new Date();
      const lastWeek = new Date();
      lastWeek.setDate(today.getDate() - 7);

      document.getElementById('endDate').value = today.toISOString().substring(0, 10);
      document.getElementById('startDate').value = lastWeek.toISOString().substring(0, 10);
    };

    function parseToStandardFormat(rawData) {
      let result = [];
      if (rawData.payload || rawData.transport || rawData.expected) {
        result.push({
          status: rawData.transport?.status ?? null,
          stored_value: rawData.expected?.stored_value ?? null,
          record_date: rawData.payload?.record_date ?? rawData.expected?.record_date ?? null,
          deadline_ms: rawData.transport?.deadline_ms ?? null,
          source_url: rawData.payload?.source_url ?? null
        });
      } else if (Array.isArray(rawData)) {
        result = rawData;
      }
      return result;
    }

    async function loadAndDrawChart() {
  const startDateStr = document.getElementById('startDate').value;
  const endDateStr = document.getElementById('endDate').value;
  const statusMsg = document.getElementById('statusMsg');
  const jsonPreview = document.getElementById('jsonPreview');

  if (!startDateStr || !endDateStr) return alert("시작일과 종료일을 선택하세요.");

  statusMsg.textContent = "저장된 데이터 파일 읽는 중...";

  const targetDates = getDateRange(startDateStr, endDateStr);
  let allStandardPoints = [];
  let failedDates = [];

  // GitHub Pages 배포 경로에 맞춘 상대 경로 처리
  const basePath = window.location.pathname.endsWith('/') 
    ? window.location.pathname 
    : window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);

  const fetchPromises = targetDates.map(async (dateStr) => {
    // 상대 경로 안전하게 지정
    const filePath = `data/auction_${dateStr}.json`;
    
    try {
      const res = await fetch(filePath);
      if (res.ok) {
        const data = await res.json();
        console.log(`[성공] ${dateStr} 데이터:`, data);
        return parseToStandardFormat(data);
      } else {
        console.warn(`[404/실패] ${filePath} HTTP 상태: ${res.status}`);
        failedDates.push(dateStr);
        return [];
      }
    } catch (e) {
      console.error(`[에러] ${filePath} 요청 실패:`, e);
      failedDates.push(dateStr);
      return [];
    }
  });

  const results = await Promise.all(fetchPromises);
  results.forEach(items => {
    if (items) allStandardPoints.push(...items);
  });

  if (allStandardPoints.length === 0) {
    statusMsg.innerHTML = `<span style="color:red;">❌ 조회 실패:</span> 선택한 기간의 데이터 파일이 존재하지 않거나 읽을 수 없습니다.<br>` +
                          `<small>(요청한 날짜 중 ${failedDates.length}일치 파일 없음. F12 콘솔 확인 필요)</small>`;
    if (myChart) myChart.destroy();
    jsonPreview.textContent = "데이터 없음";
    return;
  }

  jsonPreview.textContent = JSON.stringify(allStandardPoints, null, 2);
  renderChart(allStandardPoints, `조회 구간: ${startDateStr} ~ ${endDateStr}`);
  statusMsg.textContent = `✅ 조회 완료: 총 ${allStandardPoints.length}건의 데이터를 로드했습니다.`;
}

    function getDateRange(startStr, endStr) {
      const dates = [];
      let current = new Date(startStr);
      const last = new Date(endStr);
      while (current <= last) {
        dates.push(current.toISOString().substring(0, 10));
        current.setDate(current.getDate() + 1);
      }
      return dates;
    }

    async function handleFileUpload(event) {
      const files = event.target.files;
      const statusMsg = document.getElementById('statusMsg');
      const jsonPreview = document.getElementById('jsonPreview');

      if (!files || files.length === 0) return;

      let allPoints = [];
      for (let file of files) {
        try {
          const text = await file.text();
          const json = JSON.parse(text);
          allPoints.push(...parseToStandardFormat(json));
        } catch (err) {
          console.error("파일 해석 에러:", err);
        }
      }

      jsonPreview.textContent = JSON.stringify(allPoints, null, 2);
      renderChart(allPoints, "첨부파일 로드 데이터");
      statusMsg.textContent = `첨부파일로부터 총 ${allPoints.length}건의 데이터를 로드했습니다.`;
    }

    function renderChart(standardDataList, titleLabel) {
      standardDataList.sort((a, b) => new Date(a.record_date) - new Date(b.record_date));

      const labels = standardDataList.map(item => item.record_date ?? 'N/A');
      const values = standardDataList.map(item => item.stored_value ?? 0);

      if (myChart) myChart.destroy();

      const ctx = document.getElementById('valueChart').getContext('2d');
      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `stored_value (${titleLabel})`,
            data: values,
            borderColor: '#007bff',
            backgroundColor: 'rgba(0, 123, 255, 0.15)',
            borderWidth: 2,
            pointRadius: 4,
            fill: true,
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: '기록 일시 (record_date)' } },
            y: { title: { display: true, text: '저장 값 (stored_value)' } }
          }
        }
      });
    }
  </script>
</body>
</html>

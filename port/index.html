<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 보기</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    .layout {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    .sidebar {
      position: relative;
      flex: 0 0 50%;
      border: 5px solid #000;
    }

    .button-list {
      position: absolute;
      left: 26px;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pdf-button {
      width: 125px;
      height: 29px;
      padding: 0;
      border: 5px solid #000;
      background: #fff;
      cursor: pointer;
    }

    .pdf-button:hover,
    .pdf-button:focus-visible {
      background: #e8e8e8;
    }

    .viewer {
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    .viewer iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="layout">
    <aside class="sidebar">
      <div class="button-list">
        <button class="pdf-button" type="button"
                data-pdf="pcce_certification.pdf" aria-label="PDF 1 열기"
                title="PDF 1 열기"></button>
        <button class="pdf-button" type="button"
                data-pdf="pccp.pdf" aria-label="PDF 2 열기"
                title="PDF 2 열기"></button>
        <button class="pdf-button" type="button"
                data-pdf="topcit.pdf" aria-label="PDF 3 열기"
                title="PDF 3 열기"></button>
      </div>
    </aside>

    <section class="viewer">
      <iframe id="pdfViewer" title="PDF 보기"></iframe>
    </section>
  </main>

  <script>
    const pdfViewer = document.getElementById("pdfViewer");

    document.querySelectorAll(".pdf-button").forEach((button) => {
      button.addEventListener("click", () => {
        pdfViewer.src = button.dataset.pdf;
      });
    });
  </script>
</body>
</html>

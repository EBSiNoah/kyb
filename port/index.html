<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파일 보기</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    .layout {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    .sidebar {
      position: relative;
      z-index: 0;
      flex: 0 0 var(--sidebar-size, 50%);
      min-width: 0;
    }

    .layout.is-viewing .sidebar {
      flex: 0 0 var(--sidebar-size, 50%);
    }

    .profile-panel {
      position: absolute;
      top: 26px;
      left: 26px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(100px, 30%);
      align-items: stretch;
      gap: 12px;
      width: min(576px, calc(100% - 52px));
      min-height: 230px;
      padding: 12px;
      border: 2px solid #000;
      background: #f5f5f5;
      font-family: sans-serif;
    }

    .profile-panel__intro {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 16px;
      padding: 4px;
    }

    .profile-panel__section {
      min-width: 0;
    }

    .profile-panel__section--contact {
      padding-top: 12px;
      border-top: 1px solid #bbb;
    }

    .profile-panel__title {
      margin: 0 0 8px;
      font: 700 15px/1.2 sans-serif;
    }

    .profile-panel__text {
      margin: 0;
      color: #555;
      font: 13px/1.5 sans-serif;
    }

    .profile-panel__contact-list {
      display: grid;
      gap: 4px;
      margin: 0;
      color: #555;
      font: 12px/1.4 sans-serif;
    }

    .profile-panel__contact-item {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 6px;
    }

    .profile-panel__contact-item dt {
      font-weight: 700;
    }

    .profile-panel__contact-item dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .profile-panel__photo {
      display: grid;
      min-width: 0;
      min-height: 192px;
      aspect-ratio: 4 / 3;
      place-items: center;
      overflow: hidden;
      border: 2px dashed #777;
      background: #fff;
      color: #666;
      text-align: center;
      font: 12px/1.4 sans-serif;
    }

    .profile-panel__photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .button-list {
      position: absolute;
      left: 26px;
      bottom: 30px;
      display: flex;
      align-items: flex-start;
      width: min(576px, calc(100% - 52px));
      max-height: calc(100% - 60px);
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .button-group {
      display: flex;
      width: fit-content;
      max-width: 100%;
      min-width: 0;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border: 2px solid #000;
      background: #f5f5f5;
    }

    .button-group--credentials {
      width: 100%;
    }

    .button-group--project {
      order: -1;
    }

    .button-group__title {
      margin: 0;
      font: 700 15px/1.2 sans-serif;
    }

    .button-group__buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      min-width: 0;
    }

    .button-group--project .button-group__buttons {
      grid-template-columns: 180px;
    }

    .credential-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      min-width: 0;
    }

    .credential-files {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .credential-list,
    .credential-files {
      width: 100%;
      max-width: 552px;
    }

    .credential-entry {
      display: flex;
      width: 100%;
      min-width: 0;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
      border: 2px solid #000;
      background: #fff;
    }

    .credential-entry__label {
      font: 700 14px/1.2 sans-serif;
    }

    .credential-entry__number {
      margin: 0;
      overflow-wrap: anywhere;
      color: #333;
      font: 12px/1.4 sans-serif;
    }

    .file-button {
      display: flex;
      width: 100%;
      max-width: 180px;
      min-width: 0;
      height: 66px;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      padding: 7px 10px;
      border: 3px solid #000;
      background: #fff;
      color: #000;
      text-align: left;
      cursor: pointer;
    }

    .file-button__name {
      overflow-wrap: anywhere;
      font: 700 17px/1.2 sans-serif;
    }

    .file-button__action {
      align-self: flex-end;
      white-space: nowrap;
      font: 10px/1 sans-serif;
    }

    .file-button:hover,
    .file-button:focus-visible {
      background: #e8e8e8;
    }

    .file-button:focus-visible {
      outline: 3px solid #555;
      outline-offset: 2px;
    }

    .splitter {
      position: relative;
      z-index: 3;
      flex: 0 0 10px;
      border-right: 2px solid #000;
      border-left: 2px solid #000;
      background: #dedede;
      cursor: col-resize;
      touch-action: none;
      user-select: none;
    }

    .splitter::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 40px;
      background: #666;
      content: "";
      transform: translate(-50%, -50%);
    }

    .splitter:hover,
    .splitter:focus-visible,
    .layout.is-dragging .splitter {
      background: #bdbdbd;
      outline: none;
    }

    .splitter[hidden] {
      display: none;
    }

    .viewer {
      position: relative;
      z-index: 2;
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      border-top: 5px solid #000;
      border-right: 5px solid #000;
      border-bottom: 5px solid #000;
    }

    .viewer[hidden] {
      display: none;
    }

    .viewer-header {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 5px 10px;
      border-bottom: 2px solid #000;
      font-family: sans-serif;
    }

    .collapse-button {
      padding: 5px 12px;
      border: 2px solid #000;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }

    .collapse-button:hover,
    .collapse-button:focus-visible {
      background: #e8e8e8;
    }

    .viewer iframe {
      display: block;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="layout" id="layout">
    <aside class="sidebar">
      <section class="profile-panel" aria-label="프로필 영역">
        <div class="profile-panel__intro">
          <section class="profile-panel__section" aria-labelledby="introHeading">
            <h2 class="profile-panel__title" id="introHeading">자기소개</h2>
            <p class="profile-panel__text">자기소개 내용을 index.html에서 직접 입력하세요.</p>
          </section>
          <section class="profile-panel__section profile-panel__section--contact" aria-labelledby="contactHeading">
            <h2 class="profile-panel__title" id="contactHeading">연락처</h2>
            <dl class="profile-panel__contact-list">
              <div class="profile-panel__contact-item">
                <dt>이메일</dt>
                <dd>여기에 직접 입력</dd>
              </div>
              <div class="profile-panel__contact-item">
                <dt>GitHub</dt>
                <dd>여기에 직접 입력</dd>
              </div>
              <div class="profile-panel__contact-item">
                <dt>연락처</dt>
                <dd>여기에 직접 입력</dd>
              </div>
            </dl>
          </section>
        </div>
        <div class="profile-panel__photo" role="img" aria-label="프로필 사진을 넣을 공간">
          <span>사진을 넣을 공간</span>
          <!-- 사진을 추가하려면 위 span을 아래처럼 바꾸고 profile.jpg를 index.html과 같은 폴더에 두세요.
          <img src="profile.jpg" alt="프로필 사진">
          -->
        </div>
      </section>

      <div class="button-list">
        <section class="button-group button-group--credentials" aria-labelledby="certificationHeading">
          <h2 class="button-group__title" id="certificationHeading">자격증</h2>
          <div class="credential-list">
            <!-- 실제 인증 번호가 아직 제공되지 않아 안내 문구를 둡니다. 이 HTML의 안내 문구를 실제 번호로 직접 바꾸세요. -->
            <div class="credential-entry">
              <span class="credential-entry__label">정보처리기사</span>
              <p class="credential-entry__number">인증 번호: 여기에 직접 입력</p>
            </div>
            <div class="credential-entry">
              <span class="credential-entry__label">정보보안기사</span>
              <p class="credential-entry__number">인증 번호: 여기에 직접 입력</p>
            </div>
            <div class="credential-entry">
              <span class="credential-entry__label">SQLD</span>
              <p class="credential-entry__number">인증 번호: 여기에 직접 입력</p>
            </div>
          </div>
          <div class="button-group__buttons credential-files">
            <button class="file-button" type="button"
                    data-file="pcce_certification.pdf" aria-label="PCCE 자격증 PDF 열기"
                    title="PCCE 자격증 PDF 열기">
              <span class="file-button__name">pcce</span>
              <span class="file-button__action" aria-hidden="true">▶ 펼쳐보기</span>
            </button>
            <button class="file-button" type="button"
                    data-file="pccp.pdf" aria-label="PCCP PDF 열기"
                    title="PCCP PDF 열기">
              <span class="file-button__name">pccp</span>
              <span class="file-button__action" aria-hidden="true">▶ 펼쳐보기</span>
            </button>
            <button class="file-button" type="button"
                    data-file="topcit.pdf" aria-label="TOPCIT PDF 열기"
                    title="TOPCIT PDF 열기">
              <span class="file-button__name">topcit</span>
              <span class="file-button__action" aria-hidden="true">▶ 펼쳐보기</span>
            </button>
          </div>
        </section>

        <section class="button-group button-group--project" aria-labelledby="projectHeading">
          <h2 class="button-group__title" id="projectHeading">프로젝트</h2>
          <div class="button-group__buttons">
            <button class="file-button" type="button"
                    data-file="Dunstaurant.html" aria-label="Dunstaurant.html 열기"
                    title="Dunstaurant.html 열기">
              <span class="file-button__name">Dunstaurant</span>
              <span class="file-button__action" aria-hidden="true">▶ 펼쳐보기</span>
            </button>
          </div>
        </section>
      </div>
    </aside>

    <div class="splitter" id="splitter" role="separator" tabindex="0"
         aria-label="패널 크기 조절" aria-controls="viewer" aria-orientation="vertical"
         aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" hidden></div>

    <section class="viewer" id="viewer" aria-label="파일 미리보기" hidden>
      <div class="viewer-header">
        <span id="viewerHeading">파일 미리보기</span>
        <button class="collapse-button" id="collapseButton" type="button">접기</button>
      </div>
      <iframe id="fileViewer" title="선택한 파일"></iframe>
    </section>
  </main>

  <script>
    const layout = document.getElementById("layout");
    const viewer = document.getElementById("viewer");
    const splitter = document.getElementById("splitter");
    const fileViewer = document.getElementById("fileViewer");
    const viewerHeading = document.getElementById("viewerHeading");
    const collapseButton = document.getElementById("collapseButton");

    function getResizeRange() {
      const dimension = layout.clientWidth;
      const splitterSize = splitter.offsetWidth;
      const sidebarMinimum = 180;
      const viewerMinimum = 220;
      const min = Math.min(45, sidebarMinimum / dimension * 100);
      const max = Math.max(min, Math.min(80, (dimension - splitterSize - viewerMinimum) / dimension * 100));

      return { min, max };
    }

    function setSidebarSize(percent) {
      const range = getResizeRange();
      const size = Math.max(range.min, Math.min(range.max, percent));
      layout.style.setProperty("--sidebar-size", `${size}%`);
      splitter.setAttribute("aria-valuemin", String(Math.round(range.min)));
      splitter.setAttribute("aria-valuemax", String(Math.round(range.max)));
      splitter.setAttribute("aria-valuenow", String(Math.round(size)));
      splitter.setAttribute("aria-orientation", "vertical");
    }

    function resizeFromPointer(event) {
      const bounds = layout.getBoundingClientRect();
      const position = event.clientX - bounds.left;
      setSidebarSize(position / bounds.width * 100);
    }

    function openFile(filePath) {
      const fileName = filePath.split("/").pop();
      const isHtml = /\.html?$/i.test(fileName);

      fileViewer.src = filePath;
      fileViewer.title = `${fileName} 미리보기`;
      viewerHeading.textContent = `${fileName} ${isHtml ? "HTML" : "PDF"} 미리보기`;
      viewer.hidden = false;
      splitter.hidden = false;
      layout.classList.add("is-viewing");
      setSidebarSize(parseFloat(layout.style.getPropertyValue("--sidebar-size")) || 50);
    }

    document.querySelectorAll(".file-button").forEach((button) => {
      button.addEventListener("click", () => {
        openFile(button.dataset.file);
      });
    });

    splitter.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      event.preventDefault();
      splitter.setPointerCapture(event.pointerId);
      layout.classList.add("is-dragging");
      resizeFromPointer(event);
    });

    splitter.addEventListener("pointermove", (event) => {
      if (splitter.hasPointerCapture(event.pointerId)) {
        resizeFromPointer(event);
      }
    });

    function stopDragging(event) {
      if (splitter.hasPointerCapture(event.pointerId)) {
        splitter.releasePointerCapture(event.pointerId);
      }
      layout.classList.remove("is-dragging");
    }

    splitter.addEventListener("pointerup", stopDragging);
    splitter.addEventListener("pointercancel", stopDragging);
    splitter.addEventListener("lostpointercapture", () => layout.classList.remove("is-dragging"));

    splitter.addEventListener("keydown", (event) => {
      const currentSize = parseFloat(layout.style.getPropertyValue("--sidebar-size")) || 50;

      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();
        setSidebarSize(currentSize + (event.key === "ArrowRight" ? 2 : -2));
      } else if (event.key === "Home") {
        event.preventDefault();
        setSidebarSize(getResizeRange().min);
      } else if (event.key === "End") {
        event.preventDefault();
        setSidebarSize(getResizeRange().max);
      }
    });

    collapseButton.addEventListener("click", () => {
      viewer.hidden = true;
      splitter.hidden = true;
      layout.classList.remove("is-viewing");
    });
  </script>
</body>
</html>

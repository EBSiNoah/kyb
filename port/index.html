<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 보기</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    .layout {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    .sidebar {
      position: relative;
      flex: 1 1 100%;
      min-width: 0;
      border: 5px solid #000;
      transition: flex-basis 0.2s ease;
    }

    .layout.is-viewing .sidebar {
      flex: 0 0 50%;
    }

    .button-list {
      position: absolute;
      left: 26px;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pdf-button {
      width: 125px;
      height: 29px;
      padding: 0;
      border: 5px solid #000;
      background: #fff;
      cursor: pointer;
    }

    .pdf-button:hover,
    .pdf-button:focus-visible {
      background: #e8e8e8;
    }

    .viewer {
      display: flex;
      flex: 1 1 50%;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      border-top: 5px solid #000;
      border-right: 5px solid #000;
      border-bottom: 5px solid #000;
    }

    .viewer[hidden] {
      display: none;
    }

    .viewer-header {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 5px 10px;
      border-bottom: 2px solid #000;
      font-family: sans-serif;
    }

    .collapse-button {
      padding: 5px 12px;
      border: 2px solid #000;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }

    .collapse-button:hover,
    .collapse-button:focus-visible {
      background: #e8e8e8;
    }

    .viewer iframe {
      display: block;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: 0;
    }

    @media (max-width: 600px) {
      .layout.is-viewing {
        flex-direction: column;
      }

      .layout.is-viewing .sidebar {
        flex: 0 0 35%;
      }

      .viewer {
        flex: 1 1 65%;
        border-left: 5px solid #000;
      }

      .button-list {
        left: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="layout" id="layout">
    <aside class="sidebar">
      <div class="button-list">
        <button class="pdf-button" type="button"
                data-pdf="pcce_certification.pdf" aria-label="PCCE 자격증 PDF 열기"
                title="PCCE 자격증 PDF 열기"></button>
        <button class="pdf-button" type="button"
                data-pdf="pccp.pdf" aria-label="PCCP PDF 열기"
                title="PCCP PDF 열기"></button>
        <button class="pdf-button" type="button"
                data-pdf="topcit.pdf" aria-label="TOPCIT PDF 열기"
                title="TOPCIT PDF 열기"></button>
      </div>
    </aside>

    <section class="viewer" id="viewer" aria-label="PDF 미리보기" hidden>
      <div class="viewer-header">
        <span>PDF 미리보기</span>
        <button class="collapse-button" id="collapseButton" type="button">접기</button>
      </div>
      <iframe id="pdfViewer" title="선택한 PDF"></iframe>
    </section>
  </main>

  <script>
    const layout = document.getElementById("layout");
    const viewer = document.getElementById("viewer");
    const pdfViewer = document.getElementById("pdfViewer");
    const collapseButton = document.getElementById("collapseButton");

    function openPdf(filePath) {
      pdfViewer.src = filePath;
      viewer.hidden = false;
      layout.classList.add("is-viewing");
    }

    document.querySelectorAll(".pdf-button").forEach((button) => {
      button.addEventListener("click", () => {
        openPdf(button.dataset.pdf);
      });
    });

    collapseButton.addEventListener("click", () => {
      viewer.hidden = true;
      layout.classList.remove("is-viewing");
    });
  </script>
</body>
</html>

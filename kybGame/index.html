<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니게임천국 - 날려날려</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* 반응형 컨테이너: 600x720 비율 유지 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 600 / 720;
            max-height: 95vh;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: linear-gradient(to bottom, #74b9ff, #a29bfe);
        }
        /* 우측 상단 메뉴 버튼 UI */
        #menu-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid #fff;
            border-radius: 10px;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        #menu-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }
        #menu-btn:active {
            transform: scale(0.95);
        }
        /* 조작 가이드 안내 문구 */
        #control-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div id="game-container">
    <button id="menu-btn" title="메뉴">⚙️</button>
    <div id="control-hint">Press [ SPACE ] or Click to Turn Around!</div>
    <canvas id="gameCanvas" width="600" height="720"></canvas>
</div>

<script>
// --- 1. Canvas 및 기본 설정 ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const CANVAS_WIDTH = canvas.width;   // 600px
const CANVAS_HEIGHT = canvas.height; // 720px

// --- 2. 게임 상태 객체 (Game State) ---
const gameState = {
    score: 0,
    combo: 0,
    health: 3,
    maxHealth: 3,
    isRunning: true,
    isPaused: false
};

// --- 3. 기본 엔티티 및 스토리지 ---
const enemies = [];
let spawnTimer = 0;

// 3-1. 플레이어 (자동 이동 & 자동 펀치)
const player = {
    x: CANVAS_WIDTH / 2,
    y: CANVAS_HEIGHT - 180,
    radius: 35,
    facing: 'RIGHT', // 'LEFT' 또는 'RIGHT'
    moveSpeed: 2.5,  // 플레이어 이동 속도
    attackRange: 70, // 자동 펀치 사거리

    // 펀치 애니메이션 제어
    punchTimer: 0,
    punchInterval: 20, // 펀치 주기 (프레임 단위)
    isPunching: false,
    punchProgress: 0,

    // 방향 전환 함수 (스페이스바 / 클릭 시 호출)
    turnAround() {
        this.facing = this.facing === 'RIGHT' ? 'LEFT' : 'RIGHT';
    },

    // 자동 펀치 실행
    autoPunch() {
        this.isPunching = true;
        this.punchProgress = 1;

        let hitSuccess = false;

        for (let i = enemies.length - 1; i >= 0; i--) {
            const enemy = enemies[i];
            const dist = Math.abs(enemy.x - this.x);

            // 바라보는 방향에 있고 사거리 이내인지 확인
            const isTargetInDirection = (this.facing === 'RIGHT' && enemy.x > this.x) ||
                                        (this.facing === 'LEFT' && enemy.x < this.x);

            if (isTargetInDirection && dist <= this.attackRange + enemy.radius) {
                enemies.splice(i, 1);
                hitSuccess = true;
                gameState.score += 100 + gameState.combo * 10;
                gameState.combo++;
                break;
            }
        }
    },

    update() {
        // 1. 전방으로 자동 이동
        if (this.facing === 'RIGHT') {
            this.x += this.moveSpeed;
        } else {
            this.x -= this.moveSpeed;
        }

        // 화면 양 끝 벽 제한 (벽에 부딪히면 자동 반전)
        const minX = this.radius + 10;
        const maxX = CANVAS_WIDTH - this.radius - 10;
        if (this.x < minX) {
            this.x = minX;
            this.facing = 'RIGHT';
        } else if (this.x > maxX) {
            this.x = maxX;
            this.facing = 'LEFT';
        }

        // 2. 자동 펀치 타이머
        this.punchTimer++;
        if (this.punchTimer >= this.punchInterval) {
            this.punchTimer = 0;
            this.autoPunch();
        }

        // 3. 펀치 애니메이션 복귀 처리
        if (this.isPunching) {
            this.punchProgress -= 0.2;
            if (this.punchProgress <= 0) {
                this.punchProgress = 0;
                this.isPunching = false;
            }
        }
    },

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // 플레이어 몸체
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#d35400';
        ctx.stroke();

        // 눈
        const eyeOffset = this.facing === 'RIGHT' ? 10 : -10;
        ctx.fillStyle = '#2c3e50';
        ctx.beginPath();
        ctx.arc(eyeOffset, -8, 5, 0, Math.PI * 2);
        ctx.arc(eyeOffset + (this.facing === 'RIGHT' ? 12 : -12), -8, 5, 0, Math.PI * 2);
        ctx.fill();

        // 권투 글러브 (자동 펀치 연출)
        const punchOffset = this.punchProgress * 30;
        const gloveBaseX = this.facing === 'RIGHT' ? this.radius + 10 : -this.radius - 10;
        const gloveX = this.facing === 'RIGHT' ? gloveBaseX + punchOffset : gloveBaseX - punchOffset;

        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(gloveX, 5, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#c0392b';
        ctx.stroke();

        ctx.restore();
    }
};

// 3-2. 적 객체
class Enemy {
    constructor(side) {
        this.side = side; // 'LEFT' 또는 'RIGHT'
        this.radius = 25;
        this.x = side === 'LEFT' ? -this.radius : CANVAS_WIDTH + this.radius;
        this.y = player.y;
        this.speed = 1.2;
    }

    update() {
        // 플레이어 방향으로 이동
        if (this.side === 'LEFT') {
            this.x += this.speed;
        } else {
            this.x -= this.speed;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // 적 캐릭터 (분홍색 몬스터)
        ctx.fillStyle = '#ff7675';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#d63031';
        ctx.stroke();

        // 적 눈
        const eyeOffset = this.side === 'LEFT' ? 8 : -8;
        ctx.fillStyle = '#2d3436';
        ctx.beginPath();
        ctx.arc(eyeOffset, -5, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

// 3-3. 배경 및 라인 렌더링
function drawEnvironment() {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(0, player.y + player.radius);
    ctx.lineTo(CANVAS_WIDTH, player.y + player.radius);
    ctx.stroke();

    ctx.fillStyle = '#6c5ce7';
    ctx.fillRect(0, player.y + player.radius, CANVAS_WIDTH, CANVAS_HEIGHT - (player.y + player.radius));
}

// 3-4. UI 렌더링
function drawUI() {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`SCORE: ${gameState.score}`, CANVAS_WIDTH / 2, 50);

    if (gameState.combo > 0) {
        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(`${gameState.combo} COMBO!`, CANVAS_WIDTH / 2, 85);
    }

    ctx.textAlign = 'left';
    ctx.font = '24px sans-serif';
    let healthStr = '';
    for (let i = 0; i < gameState.maxHealth; i++) {
        healthStr += i < gameState.health ? '❤️ ' : '🖤 ';
    }
    ctx.fillText(healthStr, 20, 45);
}

// --- 4. 입력 처리 (Input Handler) ---
// 스페이스바 입력 시 방향 전환
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault(); // 스페이스바 화면 스크롤 방지
        if (!e.repeat && !gameState.isPaused && gameState.health > 0) {
            player.turnAround();
        }
    }
});

// 터치/클릭 입력 시에도 방향 전환
canvas.addEventListener('pointerdown', () => {
    if (!gameState.isPaused && gameState.health > 0) {
        player.turnAround();
    }
});

// 메뉴 버튼
const menuBtn = document.getElementById('menu-btn');
menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    gameState.isPaused = !gameState.isPaused;
});

// --- 5. 메인 게임 루프 ---
function update() {
    if (gameState.isPaused || gameState.health <= 0) return;

    player.update();

    // 적 스폰
    spawnTimer++;
    if (spawnTimer > 100) {
        const side = Math.random() < 0.5 ? 'LEFT' : 'RIGHT';
        enemies.push(new Enemy(side));
        spawnTimer = 0;
    }

    // 적 업데이트 및 피격 판정
    for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        enemy.update();

        // 플레이어 등 뒤나 전방에서 부딪혔을 때 피격 판정
        const dist = Math.abs(enemy.x - player.x);
        if (dist < player.radius + enemy.radius - 10) {
            enemies.splice(i, 1);
            gameState.health--;
            gameState.combo = 0;
        }
    }
}

function render() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    drawEnvironment();

    enemies.forEach(enemy => enemy.draw());

    player.draw();
    drawUI();

    // 일시정지 표시
    if (gameState.isPaused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
    }

    // 게임 오버 표시
    if (gameState.health <= 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.fillStyle = '#ff7675';
        ctx.font = 'bold 42px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
    }
}

function gameLoop() {
    if (gameState.isRunning) {
        update();
        render();
    }
    requestAnimationFrame(gameLoop);
}

// --- 6. 실행 ---
requestAnimationFrame(gameLoop);
</script>

</body>
</html>

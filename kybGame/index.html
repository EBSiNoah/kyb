<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니게임천국 - 날려날려</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* 반응형 컨테이너: 600x720 비율 유지 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 600 / 720;
            max-height: 95vh;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: linear-gradient(to bottom, #74b9ff, #a29bfe);
        }
        /* 우측 상단 메뉴 버튼 UI */
        #menu-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid #fff;
            border-radius: 10px;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        #menu-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }
        #menu-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <button id="menu-btn" title="메뉴">⚙️</button>
    <canvas id="gameCanvas" width="600" height="720"></canvas>
</div>

<script>
// --- 1. Canvas 및 기본 설정 ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const CANVAS_WIDTH = canvas.width;   // 600px
const CANVAS_HEIGHT = canvas.height; // 720px

// --- 2. 게임 상태 객체 (Game State) ---
const gameState = {
    score: 0,
    combo: 0,
    health: 3,
    maxHealth: 3,
    isRunning: true,
    isPaused: false
};

// --- 3. 기본 엔티티 및 스토리지 ---
const enemies = [];
let spawnTimer = 0;

// 3-1. 플레이어
const player = {
    x: CANVAS_WIDTH / 2,
    y: CANVAS_HEIGHT - 180,
    radius: 35,
    facing: 'RIGHT', // 'LEFT' 또는 'RIGHT'
    attackRange: 130, // 타격 가능 사거리
    isPunching: false,
    punchProgress: 0, // 0 -> 1 -> 0 애니메이션 진행도
    punchSpeed: 0.15,

    punch(direction) {
        this.facing = direction;
        this.isPunching = true;
        this.punchProgress = 1; // 펀치 동작 시작

        // 타격 판정 체크
        let hitSuccess = false;

        for (let i = enemies.length - 1; i >= 0; i--) {
            const enemy = enemies[i];
            const dist = Math.abs(enemy.x - this.x);

            // 1. 적이 공격 방향과 동일한 쪽에 있는지 확인
            const isTargetInDirection = (direction === 'RIGHT' && enemy.x > this.x) ||
                                        (direction === 'LEFT' && enemy.x < this.x);

            // 2. 사거리 내에 있는지 확인
            if (isTargetInDirection && dist <= this.attackRange) {
                // 타격 성공!
                enemies.splice(i, 1);
                hitSuccess = true;
                gameState.score += 100 + gameState.combo * 10;
                gameState.combo++;
                break; // 한 번의 펀치로 가장 가까운 적 1마리 타격
            }
        }

        // 허공을 쳤을 때 콤보 초기화
        if (!hitSuccess) {
            gameState.combo = 0;
        }
    },

    update() {
        // 펀치 애니메이션 복귀 처리
        if (this.isPunching) {
            this.punchProgress -= this.punchSpeed;
            if (this.punchProgress <= 0) {
                this.punchProgress = 0;
                this.isPunching = false;
            }
        }
    },

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // 플레이어 몸체
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#d35400';
        ctx.stroke();

        // 눈
        const eyeOffset = this.facing === 'RIGHT' ? 10 : -10;
        ctx.fillStyle = '#2c3e50';
        ctx.beginPath();
        ctx.arc(eyeOffset, -8, 5, 0, Math.PI * 2);
        ctx.arc(eyeOffset + (this.facing === 'RIGHT' ? 12 : -12), -8, 5, 0, Math.PI * 2);
        ctx.fill();

        // 권투 글러브 (펀치 애니메이션 적용)
        const punchOffset = this.punchProgress * 45; // 펀치 시 앞으로 이동하는 거리
        const gloveBaseX = this.facing === 'RIGHT' ? this.radius + 12 : -this.radius - 12;
        const gloveX = this.facing === 'RIGHT' ? gloveBaseX + punchOffset : gloveBaseX - punchOffset;

        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(gloveX, 5, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#c0392b';
        ctx.stroke();

        // 사거리 가이드라인 (디버그/시각적 도움)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, this.attackRange, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
    }
};

// 3-2. 적 객체 생성자
class Enemy {
    constructor(side) {
        this.side = side; // 'LEFT' 또는 'RIGHT'
        this.radius = 25;
        this.x = side === 'LEFT' ? -this.radius : CANVAS_WIDTH + this.radius;
        this.y = player.y;
        this.speed = 1.8;
    }

    update() {
        // 플레이어 방향으로 이동
        if (this.side === 'LEFT') {
            this.x += this.speed;
        } else {
            this.x -= this.speed;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // 적 캐릭터 (분홍색 몬스터)
        ctx.fillStyle = '#ff7675';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#d63031';
        ctx.stroke();

        // 적 눈 (플레이어를 바라봄)
        const eyeOffset = this.side === 'LEFT' ? 8 : -8;
        ctx.fillStyle = '#2d3436';
        ctx.beginPath();
        ctx.arc(eyeOffset, -5, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

// 3-3. 배경 및 라인 렌더링
function drawEnvironment() {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(0, player.y + player.radius);
    ctx.lineTo(CANVAS_WIDTH, player.y + player.radius);
    ctx.stroke();

    ctx.fillStyle = '#6c5ce7';
    ctx.fillRect(0, player.y + player.radius, CANVAS_WIDTH, CANVAS_HEIGHT - (player.y + player.radius));
}

// 3-4. UI 렌더링
function drawUI() {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`SCORE: ${gameState.score}`, CANVAS_WIDTH / 2, 50);

    if (gameState.combo > 0) {
        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(`${gameState.combo} COMBO!`, CANVAS_WIDTH / 2, 85);
    }

    ctx.textAlign = 'left';
    ctx.font = '24px sans-serif';
    let healthStr = '';
    for (let i = 0; i < gameState.maxHealth; i++) {
        healthStr += i < gameState.health ? '❤️ ' : '🖤 ';
    }
    ctx.fillText(healthStr, 20, 45);
}

// --- 4. 입력 처리 (Input Handler) ---
function handleAttack(direction) {
    if (gameState.isPaused || gameState.health <= 0) return;
    player.punch(direction);
}

// 키보드 입력
window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        handleAttack('LEFT');
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        handleAttack('RIGHT');
    }
});

// 마우스/터치 입력 (화면 반쪽 기준)
canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const canvasCenterX = rect.width / 2;

    if (clickX < canvasCenterX) {
        handleAttack('LEFT');
    } else {
        handleAttack('RIGHT');
    }
});

// 메뉴 버튼
const menuBtn = document.getElementById('menu-btn');
menuBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // 메뉴 버튼 클릭 시 공격 발생 방지
    gameState.isPaused = !gameState.isPaused;
});

// --- 5. 메인 게임 루프 ---
function update() {
    if (gameState.isPaused || gameState.health <= 0) return;

    player.update();

    // 임시 적 스폰 시스템 (테스트용)
    spawnTimer++;
    if (spawnTimer > 90) { // 약 1.5초마다 생성
        const side = Math.random() < 0.5 ? 'LEFT' : 'RIGHT';
        enemies.push(new Enemy(side));
        spawnTimer = 0;
    }

    // 적 업데이트 및 충돌 판정
    for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        enemy.update();

        // 플레이어 피격 충돌 체크 (몸체가 닿았을 때)
        const dist = Math.abs(enemy.x - player.x);
        if (dist < player.radius + enemy.radius) {
            enemies.splice(i, 1);
            gameState.health--;
            gameState.combo = 0;

            if (gameState.health <= 0) {
                console.log("게임 오버!");
            }
        }
    }
}

function render() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    drawEnvironment();

    // 적 그리기
    enemies.forEach(enemy => enemy.draw());

    player.draw();
    drawUI();

    // 일시정지 표시
    if (gameState.isPaused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
    }

    // 게임 오버 표시
    if (gameState.health <= 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.fillStyle = '#ff7675';
        ctx.font = 'bold 42px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
    }
}

function gameLoop() {
    if (gameState.isRunning) {
        update();
        render();
    }
    requestAnimationFrame(gameLoop);
}

// --- 6. 실행 ---
requestAnimationFrame(gameLoop);
</script>

</body>
</html>

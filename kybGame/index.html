<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>미니게임천국 - 날려날려</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* 뷰포트 전체 중앙 정렬 */
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 5:6 비율(600x720)을 완벽히 유지하는 반응형 래퍼 */
        #game-container {
            position: relative;
            /* 화면 가로/세로 중 작은 쪽에 맞춰 5:6 비율로 자동 확장/축소 */
            width: min(100vw, 83.33vh);
            height: min(120vw, 100vh);
            aspect-ratio: 5 / 6;
            max-width: 600px;
            max-height: 720px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 16px;
            overflow: hidden;
            background-color: #000;
        }

        /* Canvas는 컨테이너 내부를 100% 채움 */
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: linear-gradient(to bottom, #74b9ff, #a29bfe);
        }

        /* UI 엘리먼트 (컨테이너 내부에 상대 배치) */
        #menu-btn {
            position: absolute;
            top: 2.5%;
            right: 2.5%;
            width: 8%;
            height: 8%;
            min-width: 36px;
            min-height: 36px;
            max-width: 48px;
            max-height: 48px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid #fff;
            border-radius: 20%;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        #menu-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        #menu-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        #control-hint {
            position: absolute;
            bottom: 3%;
            width: 100%;
            text-align: center;
            font-size: clamp(12px, 2.5vw, 16px);
            font-weight: bold;
            color: rgba(255, 255, 255, 0.85);
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        #restart-btn {
            position: absolute;
            top: 62%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 28px;
            font-size: clamp(16px, 3.5vw, 20px);
            font-weight: bold;
            color: #fff;
            background: #e74c3c;
            border: 3px solid #fff;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #c0392b, 0 10px 20px rgba(0, 0, 0, 0.4);
            display: none;
            z-index: 20;
            transition: all 0.1s ease;
            white-space: nowrap;
        }

        #restart-btn:hover {
            background: #ff7675;
            transform: translate(-50%, -53%);
        }

        #restart-btn:active {
            transform: translate(-50%, -47%);
            box-shadow: 0 2px 0 #c0392b;
        }
    </style>
</head>
<body>

<div id="game-container">
    <button id="menu-btn" title="메뉴">⚙️</button>
    <button id="restart-btn">RESTART</button>
    <div id="control-hint">Press [ SPACE ] to Turn Around!</div>
    <!-- 고정 논리 해상도 600x720 지정 -->
    <canvas id="gameCanvas" width="600" height="720"></canvas>
</div>

<script>
// --- 1. Canvas 및 기본 설정 ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const CANVAS_WIDTH = 600;
const CANVAS_HEIGHT = 720;
const HIGH_SCORE_KEY = "fly_game_high_score";

// --- 2. LocalStorage 최고 점수 불러오기 ---
function loadHighScore() {
    const saved = localStorage.getItem(HIGH_SCORE_KEY);
    return saved ? parseInt(saved, 10) : 0;
}

// --- 3. 게임 상태 객체 ---
const gameState = {
    score: 0,
    highScore: loadHighScore(),
    isNewRecord: false,
    combo: 0,
    comboTimer: 0,
    maxComboTimer: 100,
    health: 3,
    maxHealth: 3,
    shield: 0,               
    fullHealthHeartCount: 0, 
    
    shurikenTimer: 0,        
    auraTimer: 0,            
    
    gameTime: 0,
    currentEnemySpeed: 2.2,
    isRunning: true,
    isPaused: false
};

// --- 4. 엔티티 리스트 ---
let enemies = [];
let projectiles = [];
let playerShurikens = [];
let droppedItems = [];
let spawnTimer = 0;
let currentSpawnInterval = 80;

function collectItem(item) {
    if (item.type === 'HEAL') {
        if (gameState.health < gameState.maxHealth) {
            gameState.health++;
        } else {
            gameState.fullHealthHeartCount++;
            if (gameState.fullHealthHeartCount >= 2) {
                gameState.shield++;
                gameState.fullHealthHeartCount = 0;
            }
        }
    } else if (item.type === 'SHURIKEN') {
        gameState.shurikenTimer = 600; 
    } else if (item.type === 'AURA') {
        gameState.auraTimer = 600; 
    }
}

function addScore(amount) {
    gameState.score += amount;
    if (gameState.score > gameState.highScore) {
        gameState.highScore = gameState.score;
        gameState.isNewRecord = true;
        localStorage.setItem(HIGH_SCORE_KEY, gameState.highScore.toString());
    }
}

// 4-1. 관통 표창 클래스
class PlayerShuriken {
    constructor(x, y, dir) {
        this.x = x;
        this.y = y;
        this.dir = dir;
        this.speed = 12;
        this.radius = 12;
        this.rotation = 0;
        this.hitEnemies = new Set();
    }

    update() {
        this.x += this.speed * this.dir;
        this.rotation += 0.3;

        for (let i = droppedItems.length - 1; i >= 0; i--) {
            const item = droppedItems[i];
            if (Math.abs(item.x - this.x) < this.radius + item.radius && Math.abs(item.y - this.y) < 35) {
                collectItem(item);
                droppedItems.splice(i, 1);
            }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            const enemy = enemies[i];
            if (this.hitEnemies.has(enemy)) continue;

            if (Math.abs(enemy.x - this.x) < this.radius + enemy.radius && Math.abs(enemy.y - this.y) < 30) {
                this.hitEnemies.add(enemy);
                enemy.hp--;

                if (enemy.hp <= 0) {
                    onEnemyKilled(enemy, i);
                } else {
                    enemy.x += this.dir * 20;
                }
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        
        ctx.fillStyle = '#00cec9';
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
            ctx.rotate(Math.PI / 2);
            ctx.lineTo(0, -this.radius);
            ctx.lineTo(this.radius / 3, -this.radius / 3);
        }
        ctx.fill();
        ctx.restore();
    }
}

// 4-2. 낙하 아이템 클래스
class Item {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.targetY = player.y + player.radius - 12;
        this.type = type;
        this.radius = 16;
        this.velocityY = -3;
        this.gravity = 0.35;
        this.isGrounded = false;
        this.bounceTimer = Math.random() * 10;
    }

    update() {
        if (!this.isGrounded) {
            this.velocityY += this.gravity;
            this.y += this.velocityY;

            if (this.y >= this.targetY) {
                this.y = this.targetY;
                this.isGrounded = true;
            }
        } else {
            this.bounceTimer += 0.08;
        }
    }

    draw() {
        const offsetY = this.isGrounded ? Math.sin(this.bounceTimer) * 4 : 0;

        ctx.save();
        ctx.translate(this.x, this.y + offsetY);

        let icon = '💖';
        if (this.type === 'SHURIKEN') icon = '🥏';
        else if (this.type === 'AURA') icon = '✨';

        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(icon, 0, 0);

        ctx.restore();
    }
}

function onEnemyKilled(enemy, index) {
    enemies.splice(index, 1);
    gameState.combo++;
    addScore(enemy.scoreValue + gameState.combo * 10);
    gameState.comboTimer = gameState.maxComboTimer;

    if (Math.random() < 0.20) {
        const itemTypes = ['HEAL', 'SHURIKEN', 'AURA'];
        const chosenType = itemTypes[Math.floor(Math.random() * itemTypes.length)];
        droppedItems.push(new Item(enemy.x, enemy.y, chosenType));
    }
}

// 4-3. 플레이어
const player = {
    x: CANVAS_WIDTH / 2,
    y: CANVAS_HEIGHT - 180,
    radius: 35,
    facing: 'RIGHT',
    moveSpeed: 3.5,
    attackRange: 130,
    auraRange: 180,

    punchTimer: 0,
    punchInterval: 14,
    isPunching: false,
    punchProgress: 0,

    reset() {
        this.x = CANVAS_WIDTH / 2;
        this.facing = 'RIGHT';
        this.punchTimer = 0;
        this.isPunching = false;
        this.punchProgress = 0;
    },

    turnAround() {
        this.facing = this.facing === 'RIGHT' ? 'LEFT' : 'RIGHT';
    },

    autoPunch() {
        this.isPunching = true;
        this.punchProgress = 1;

        const dir = this.facing === 'RIGHT' ? 1 : -1;

        if (gameState.shurikenTimer > 0) {
            playerShurikens.push(new PlayerShuriken(this.x + dir * 20, this.y, dir));
        }

        for (let i = droppedItems.length - 1; i >= 0; i--) {
            const item = droppedItems[i];
            const dist = Math.abs(item.x - this.x);
            const isTargetInDirection = (this.facing === 'RIGHT' && item.x > this.x - 10) ||
                                        (this.facing === 'LEFT' && item.x < this.x + 10);

            if (isTargetInDirection && dist <= this.attackRange) {
                collectItem(item);
                droppedItems.splice(i, 1);
            }
        }

        for (let i = projectiles.length - 1; i >= 0; i--) {
            const proj = projectiles[i];
            const dist = Math.abs(proj.x - this.x);
            const isTargetInDirection = (this.facing === 'RIGHT' && proj.x > this.x - 10) ||
                                        (this.facing === 'LEFT' && proj.x < this.x + 10);
            
            if (isTargetInDirection && dist <= this.attackRange && Math.abs(proj.y - this.y) < 40) {
                projectiles.splice(i, 1);
                addScore(50);
            }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            const enemy = enemies[i];
            const dist = Math.abs(enemy.x - this.x);
            const isTargetInDirection = (this.facing === 'RIGHT' && enemy.x > this.x - 10) ||
                                        (this.facing === 'LEFT' && enemy.x < this.x + 10);

            if (isTargetInDirection && dist <= this.attackRange) {
                enemy.hp--;
                
                if (enemy.hp <= 0) {
                    onEnemyKilled(enemy, i);
                } else {
                    const knockback = enemy.side === 'LEFT' ? -25 : 25;
                    enemy.x += knockback;
                }
                break;
            }
        }
    },

    update() {
        if (this.facing === 'RIGHT') {
            this.x += this.moveSpeed;
        } else {
            this.x -= this.moveSpeed;
        }

        const minX = this.radius + 10;
        const maxX = CANVAS_WIDTH - this.radius - 10;
        if (this.x < minX) this.x = minX;
        if (this.x > maxX) this.x = maxX;

        this.punchTimer++;
        if (this.punchTimer >= this.punchInterval) {
            this.punchTimer = 0;
            this.autoPunch();
        }

        if (this.isPunching) {
            this.punchProgress -= 0.25;
            if (this.punchProgress <= 0) {
                this.punchProgress = 0;
                this.isPunching = false;
            }
        }
    },

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (gameState.auraTimer > 0) {
            ctx.fillStyle = 'rgba(9, 132, 227, 0.15)';
            ctx.beginPath();
            ctx.arc(0, 0, this.auraRange, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(116, 185, 255, 0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        if (gameState.shield > 0) {
            ctx.strokeStyle = '#00cec9';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#d35400';
        ctx.stroke();

        const eyeOffset = this.facing === 'RIGHT' ? 10 : -10;
        ctx.fillStyle = '#2c3e50';
        ctx.beginPath();
        ctx.arc(eyeOffset, -8, 5, 0, Math.PI * 2);
        ctx.arc(eyeOffset + (this.facing === 'RIGHT' ? 12 : -12), -8, 5, 0, Math.PI * 2);
        ctx.fill();

        const punchOffset = this.punchProgress * 70;
        const gloveBaseX = this.facing === 'RIGHT' ? this.radius + 10 : -this.radius - 10;
        const gloveX = this.facing === 'RIGHT' ? gloveBaseX + punchOffset : gloveBaseX - punchOffset;

        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(gloveX, 5, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#c0392b';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.restore();
    }
};

// 4-4. 궁수 포물선 화살
class Projectile {
    constructor(startX, startY, targetX, targetY) {
        this.x = startX;
        this.y = startY;
        this.startX = startX;
        this.startY = startY;
        this.targetX = targetX;
        this.targetY = targetY;
        this.radius = 8;
        
        this.progress = 0;
        this.speed = 0.025;
        this.arcHeight = 120;
    }

    update() {
        this.progress += this.speed;
        this.x = this.startX + (this.targetX - this.startX) * this.progress;
        
        const linearY = this.startY + (this.targetY - this.startY) * this.progress;
        const arc = Math.sin(this.progress * Math.PI) * this.arcHeight;
        this.y = linearY - arc;
    }

    draw() {
        ctx.save();
        ctx.fillStyle = '#2ecc71';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#27ae60';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
    }
}

// 4-5. 적 클래스
class Enemy {
    constructor(side, type = 'NORMAL') {
        this.side = side;
        this.type = type;
        this.x = side === 'LEFT' ? -30 : CANVAS_WIDTH + 30;
        this.y = player.y;

        switch (type) {
            case 'TANKER':
                this.radius = 36;
                this.hp = 3;
                this.maxHp = 3;
                this.speedMultiplier = 0.5;
                this.color = '#2980b9';
                this.borderColor = '#1f618d';
                this.damage = 1;
                this.scoreValue = 300;
                break;
            case 'SPEEDER':
                this.radius = 20;
                this.hp = 1;
                this.maxHp = 1;
                this.speedMultiplier = 1.5;
                this.color = '#f1c40f';
                this.borderColor = '#f39c12';
                this.damage = 1;
                this.scoreValue = 150;
                break;
            case 'ARCHER':
                this.radius = 25;
                this.hp = 1;
                this.maxHp = 1;
                this.speedMultiplier = 0.35;
                this.color = '#2ecc71';
                this.borderColor = '#27ae60';
                this.damage = 1;
                this.scoreValue = 200;
                this.shootTimer = 0;
                this.shootInterval = 110;
                break;
            case 'KAMIKAZE':
                this.radius = 24;
                this.hp = 1;
                this.maxHp = 1;
                this.speedMultiplier = 1.1;
                this.color = '#9b59b6';
                this.borderColor = '#8e44ad';
                this.damage = 2;
                this.scoreValue = 250;
                this.pulseTimer = 0;
                break;
            default:
                this.radius = 25;
                this.hp = 1;
                this.maxHp = 1;
                this.speedMultiplier = 1.0;
                this.color = '#ff7675';
                this.borderColor = '#d63031';
                this.damage = 1;
                this.scoreValue = 100;
                break;
        }
    }

    update() {
        let slowFactor = 1.0;
        if (gameState.auraTimer > 0 && Math.abs(this.x - player.x) <= player.auraRange) {
            slowFactor = 0.5;
        }

        const moveSpeed = gameState.currentEnemySpeed * this.speedMultiplier * slowFactor;
        if (this.side === 'LEFT') {
            this.x += moveSpeed;
        } else {
            this.x -= moveSpeed;
        }

        if (this.type === 'ARCHER') {
            this.shootTimer++;
            if (this.shootTimer >= this.shootInterval) {
                this.shootTimer = 0;
                projectiles.push(new Projectile(this.x, this.y - 10, player.x, player.y));
            }
        }

        if (this.type === 'KAMIKAZE') {
            this.pulseTimer += 0.15;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        let drawRadius = this.radius;
        if (this.type === 'KAMIKAZE') {
            drawRadius += Math.sin(this.pulseTimer) * 3;
        }

        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, drawRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = this.borderColor;
        ctx.stroke();

        const eyeOffset = this.side === 'LEFT' ? 8 : -8;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(eyeOffset, -5, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(eyeOffset + (this.side === 'LEFT' ? 2 : -2), -5, 2.5, 0, Math.PI * 2);
        ctx.fill();

        if (this.type === 'TANKER' && this.hp < this.maxHp) {
            const barW = 40;
            const barH = 6;
            const hpRatio = this.hp / this.maxHp;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(-barW/2, -this.radius - 14, barW, barH);
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(-barW/2, -this.radius - 14, barW * hpRatio, barH);
        }

        ctx.restore();
    }
}

// 4-6. 환경
function drawEnvironment() {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(0, player.y + player.radius);
    ctx.lineTo(CANVAS_WIDTH, player.y + player.radius);
    ctx.stroke();

    ctx.fillStyle = '#6c5ce7';
    ctx.fillRect(0, player.y + player.radius, CANVAS_WIDTH, CANVAS_HEIGHT - (player.y + player.radius));
}

// 4-7. UI (점수, 최고점수, 체력, 버프, 콤보)
function drawUI() {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`SCORE: ${gameState.score}`, CANVAS_WIDTH / 2, 38);

    ctx.font = 'bold 16px sans-serif';
    ctx.fillStyle = '#f1c40f';
    ctx.fillText(`🏆 BEST: ${gameState.highScore}`, CANVAS_WIDTH / 2, 60);

    ctx.textAlign = 'left';
    ctx.font = '22px sans-serif';
    let healthStr = '';
    for (let i = 0; i < gameState.maxHealth; i++) {
        healthStr += i < gameState.health ? '❤️ ' : '🖤 ';
    }
    if (gameState.shield > 0) {
        healthStr += `🛡️x${gameState.shield}`;
    } else if (gameState.health === gameState.maxHealth && gameState.fullHealthHeartCount > 0) {
        healthStr += `(💗1/2)`;
    }
    ctx.fillText(healthStr, 20, 42);

    let buffX = 20;
    let buffY = 82;
    ctx.font = 'bold 16px sans-serif';
    
    if (gameState.shurikenTimer > 0) {
        const sec = Math.ceil(gameState.shurikenTimer / 60);
        ctx.fillStyle = '#00cec9';
        ctx.fillText(`🥏 표창: ${sec}s`, buffX, buffY);
        buffY += 25;
    }
    if (gameState.auraTimer > 0) {
        const sec = Math.ceil(gameState.auraTimer / 60);
        ctx.fillStyle = '#74b9ff';
        ctx.fillText(`✨ 오오라: ${sec}s`, buffX, buffY);
    }

    if (gameState.combo > 0) {
        const barWidth = 220;
        const barHeight = 14;
        const barX = (CANVAS_WIDTH - barWidth) / 2;
        const barY = 100;

        ctx.textAlign = 'center';
        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(`${gameState.combo} COMBO!`, CANVAS_WIDTH / 2, 88);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(barX, barY, barWidth, barHeight);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(barX, barY, barWidth, barHeight);

        const fillRatio = Math.max(0, gameState.comboTimer / gameState.maxComboTimer);
        const currentFillWidth = barWidth * fillRatio;

        let fillColor = '#2ecc71';
        if (fillRatio < 0.3) {
            fillColor = '#e74c3c';
        } else if (fillRatio < 0.6) {
            fillColor = '#f39c12';
        }

        ctx.fillStyle = fillColor;
        ctx.fillRect(barX, barY, currentFillWidth, barHeight);
    }
}

function takePlayerDamage(damage) {
    let remainingDamage = damage;
    
    while (remainingDamage > 0 && gameState.shield > 0) {
        gameState.shield--;
        remainingDamage--;
    }

    gameState.health -= remainingDamage;
    gameState.combo = 0;
    gameState.comboTimer = 0;

    if (gameState.health <= 0) {
        gameState.health = 0;
        restartBtn.style.display = 'block';
        menuBtn.disabled = true;
    }
}

// --- 5. 게임 리셋 ---
const restartBtn = document.getElementById('restart-btn');
const menuBtn = document.getElementById('menu-btn');

function resetGame() {
    gameState.score = 0;
    gameState.isNewRecord = false;
    gameState.combo = 0;
    gameState.comboTimer = 0;
    gameState.health = gameState.maxHealth;
    gameState.shield = 0;
    gameState.fullHealthHeartCount = 0;
    gameState.shurikenTimer = 0;
    gameState.auraTimer = 0;
    gameState.gameTime = 0;
    gameState.currentEnemySpeed = 2.2;
    gameState.isPaused = false;
    enemies = [];
    projectiles = [];
    playerShurikens = [];
    droppedItems = [];
    spawnTimer = 0;
    currentSpawnInterval = 80;
    player.reset();
    
    restartBtn.style.display = 'none';
    menuBtn.disabled = false;
}

// --- 6. 이벤트 리스너 ---
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        if (gameState.health > 0 && !e.repeat && !gameState.isPaused) {
            player.turnAround();
        }
    }
});

// 터치/클릭으로도 전환 가능하도록 대응
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState.health > 0 && !gameState.isPaused) {
        player.turnAround();
    }
});

restartBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    resetGame();
});

menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (gameState.health > 0) {
        gameState.isPaused = !gameState.isPaused;
    }
});

// --- 7. 메인 게임 루프 ---
function update() {
    if (gameState.isPaused || gameState.health <= 0) return;

    gameState.gameTime++;
    gameState.currentEnemySpeed = Math.min(4.5, 2.2 + (gameState.gameTime / 150) * 0.25);
    currentSpawnInterval = Math.max(25, 80 - Math.floor(gameState.gameTime / 150) * 5);

    if (gameState.shurikenTimer > 0) gameState.shurikenTimer--;
    if (gameState.auraTimer > 0) gameState.auraTimer--;

    player.update();
    droppedItems.forEach(item => item.update());

    for (let i = playerShurikens.length - 1; i >= 0; i--) {
        const shuriken = playerShurikens[i];
        shuriken.update();
        if (shuriken.x < -50 || shuriken.x > CANVAS_WIDTH + 50) {
            playerShurikens.splice(i, 1);
        }
    }

    if (gameState.combo > 0) {
        const drainRate = 0.9 + (gameState.combo * 0.09);
        gameState.comboTimer -= drainRate;

        if (gameState.comboTimer <= 0) {
            gameState.comboTimer = 0;
            gameState.combo = 0;
        }
    }

    spawnTimer++;
    if (spawnTimer >= currentSpawnInterval) {
        const side = Math.random() < 0.5 ? 'LEFT' : 'RIGHT';
        
        const rand = Math.random();
        let enemyType = 'NORMAL';
        if (rand < 0.45) enemyType = 'NORMAL';
        else if (rand < 0.65) enemyType = 'SPEEDER';
        else if (rand < 0.80) enemyType = 'KAMIKAZE';
        else if (rand < 0.92) enemyType = 'ARCHER';
        else enemyType = 'TANKER';

        enemies.push(new Enemy(side, enemyType));
        spawnTimer = 0;
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
        const proj = projectiles[i];
        proj.update();

        const dist = Math.hypot(proj.x - player.x, proj.y - player.y);
        if (dist < player.radius + proj.radius - 5) {
            projectiles.splice(i, 1);
            takePlayerDamage(1);
        } else if (proj.progress >= 1.0) {
            projectiles.splice(i, 1);
        }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        enemy.update();

        const dist = Math.abs(enemy.x - player.x);
        if (dist < player.radius + enemy.radius - 12) {
            const damage = enemy.damage;
            enemies.splice(i, 1);
            takePlayerDamage(damage);
        }
    }
}

function render() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    drawEnvironment();

    droppedItems.forEach(item => item.draw());
    enemies.forEach(enemy => enemy.draw());
    projectiles.forEach(proj => proj.draw());
    playerShurikens.forEach(shuriken => shuriken.draw());

    player.draw();
    drawUI();

    if (gameState.isPaused && gameState.health > 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
    }

    if (gameState.health <= 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.fillStyle = '#ff7675';
        ctx.font = 'bold 44px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 80);

        ctx.fillStyle = '#ffffff';
        ctx.font = '22px sans-serif';
        ctx.fillText(`FINAL SCORE: ${gameState.score}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 20);

        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText(`🏆 BEST SCORE: ${gameState.highScore}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 15);

        if (gameState.isNewRecord) {
            ctx.fillStyle = '#e67e22';
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText('🎉 NEW RECORD! 🎉', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 50);
        }
    }
}

function gameLoop() {
    if (gameState.isRunning) {
        update();
        render();
    }
    requestAnimationFrame(gameLoop);
}

// --- 8. 게임 시작 ---
requestAnimationFrame(gameLoop);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니게임천국 - 날려날려</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* 반응형 컨테이너: 600x720 비율 유지 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 600 / 720;
            max-height: 95vh;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: linear-gradient(to bottom, #74b9ff, #a29bfe);
        }
        /* 우측 상단 메뉴 버튼 UI */
        #menu-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid #fff;
            border-radius: 10px;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        #menu-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }
        #menu-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        /* 비활성화 상태 메뉴 버튼 */
        #menu-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }
        /* 조작 가이드 안내 문구 */
        #control-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        /* 재시작 버튼 UI */
        #restart-btn {
            position: absolute;
            top: 58%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 32px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: #e74c3c;
            border: 3px solid #fff;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #c0392b, 0 10px 20px rgba(0, 0, 0, 0.4);
            display: none;
            z-index: 20;
            transition: all 0.1s ease;
        }
        #restart-btn:hover {
            background: #ff7675;
            transform: translate(-50%, -53%);
        }
        #restart-btn:active {
            transform: translate(-50%, -47%);
            box-shadow: 0 2px 0 #c0392b;
        }
    </style>
</head>
<body>

<div id="game-container">
    <button id="menu-btn" title="메뉴">⚙️</button>
    <button id="restart-btn">RESTART</button>
    <div id="control-hint">Press [ SPACE ] to Turn Around!</div>
    <canvas id="gameCanvas" width="600" height="720"></canvas>
</div>

<script>
// --- 1. Canvas 및 기본 설정 ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const CANVAS_WIDTH = canvas.width;   // 600px
const CANVAS_HEIGHT = canvas.height; // 720px

// --- 2. 게임 상태 객체 (Game State) ---
const gameState = {
    score: 0,
    combo: 0,
    comboTimer: 0,       // 콤보 유효 시간 게이지 (0 ~ 100)
    maxComboTimer: 100,  // 게이지 최대값
    health: 3,
    maxHealth: 3,
    gameTime: 0,         // 진행 시간 프레임
    gameSpeedMultiplier: 1.0, // 시간 비례 게임 속도 배율
    isRunning: true,
    isPaused: false
};

// --- 3. 기본 엔티티 및 스토리지 ---
let enemies = [];
let spawnTimer = 0;
let currentSpawnInterval = 90; // 초기 적 스폰 주기 (프레임)

// 3-1. 플레이어
const player = {
    x: CANVAS_WIDTH / 2,
    y: CANVAS_HEIGHT - 180,
    radius: 35,
    facing: 'RIGHT',
    baseMoveSpeed: 3.5, // 기본 이동 속도 증가 (2.5 -> 3.5)
    attackRange: 130,

    punchTimer: 0,
    basePunchInterval: 14, // 기본 펀치 간격 단축 (18 -> 14)
    isPunching: false,
    punchProgress: 0,

    reset() {
        this.x = CANVAS_WIDTH / 2;
        this.facing = 'RIGHT';
        this.punchTimer = 0;
        this.isPunching = false;
        this.punchProgress = 0;
    },

    turnAround() {
        this.facing = this.facing === 'RIGHT' ? 'LEFT' : 'RIGHT';
    },

    autoPunch() {
        this.isPunching = true;
        this.punchProgress = 1;

        for (let i = enemies.length - 1; i >= 0; i--) {
            const enemy = enemies[i];
            const dist = Math.abs(enemy.x - this.x);

            const isTargetInDirection = (this.facing === 'RIGHT' && enemy.x > this.x - 10) ||
                                        (this.facing === 'LEFT' && enemy.x < this.x + 10);

            if (isTargetInDirection && dist <= this.attackRange) {
                enemies.splice(i, 1);
                
                // 점수 계산 및 콤보 갱신
                gameState.combo++;
                gameState.score += 100 + gameState.combo * 10;
                
                // 적 격파 시 콤보 게이지 100% 충전
                gameState.comboTimer = gameState.maxComboTimer;
                break;
            }
        }
    },

    update() {
        // 게임 배율에 따른 플레이어 실시간 이동 속도
        const currentSpeed = this.baseMoveSpeed * gameState.gameSpeedMultiplier;

        if (this.facing === 'RIGHT') {
            this.x += currentSpeed;
        } else {
            this.x -= currentSpeed;
        }

        const minX = this.radius + 10;
        const maxX = CANVAS_WIDTH - this.radius - 10;
        if (this.x < minX) {
            this.x = minX;
        } else if (this.x > maxX) {
            this.x = maxX;
        }

        // 펀치 주기 가속
        this.punchTimer++;
        const currentInterval = Math.max(8, Math.floor(this.basePunchInterval / gameState.gameSpeedMultiplier));
        if (this.punchTimer >= currentInterval) {
            this.punchTimer = 0;
            this.autoPunch();
        }

        if (this.isPunching) {
            this.punchProgress -= 0.25 * gameState.gameSpeedMultiplier;
            if (this.punchProgress <= 0) {
                this.punchProgress = 0;
                this.isPunching = false;
            }
        }
    },

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#d35400';
        ctx.stroke();

        const eyeOffset = this.facing === 'RIGHT' ? 10 : -10;
        ctx.fillStyle = '#2c3e50';
        ctx.beginPath();
        ctx.arc(eyeOffset, -8, 5, 0, Math.PI * 2);
        ctx.arc(eyeOffset + (this.facing === 'RIGHT' ? 12 : -12), -8, 5, 0, Math.PI * 2);
        ctx.fill();

        const punchOffset = this.punchProgress * 70;
        const gloveBaseX = this.facing === 'RIGHT' ? this.radius + 10 : -this.radius - 10;
        const gloveX = this.facing === 'RIGHT' ? gloveBaseX + punchOffset : gloveBaseX - punchOffset;

        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(gloveX, 5, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#c0392b';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.restore();
    }
};

// 3-2. 적 객체
class Enemy {
    constructor(side) {
        this.side = side;
        this.radius = 25;
        this.x = side === 'LEFT' ? -this.radius : CANVAS_WIDTH + this.radius;
        this.y = player.y;
        
        // 기본 속도 상향 + 게임 가속 배율 적용 + 약간의 개별 속도 차이
        const baseSpeed = 2.0 + Math.random() * 0.6;
        this.speed = baseSpeed * gameState.gameSpeedMultiplier;
    }

    update() {
        if (this.side === 'LEFT') {
            this.x += this.speed;
        } else {
            this.x -= this.speed;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = '#ff7675';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#d63031';
        ctx.stroke();

        const eyeOffset = this.side === 'LEFT' ? 8 : -8;
        ctx.fillStyle = '#2d3436';
        ctx.beginPath();
        ctx.arc(eyeOffset, -5, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

// 3-3. 배경 및 라인 렌더링
function drawEnvironment() {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(0, player.y + player.radius);
    ctx.lineTo(CANVAS_WIDTH, player.y + player.radius);
    ctx.stroke();

    ctx.fillStyle = '#6c5ce7';
    ctx.fillRect(0, player.y + player.radius, CANVAS_WIDTH, CANVAS_HEIGHT - (player.y + player.radius));
}

// 3-4. UI 렌더링
function drawUI() {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`SCORE: ${gameState.score}`, CANVAS_WIDTH / 2, 45);

    ctx.textAlign = 'left';
    ctx.font = '24px sans-serif';
    let healthStr = '';
    for (let i = 0; i < gameState.maxHealth; i++) {
        healthStr += i < gameState.health ? '❤️ ' : '🖤 ';
    }
    ctx.fillText(healthStr, 20, 45);

    // 콤보 UI 및 실시간 게이지 바
    if (gameState.combo > 0) {
        const barWidth = 220;
        const barHeight = 14;
        const barX = (CANVAS_WIDTH - barWidth) / 2;
        const barY = 95;

        ctx.textAlign = 'center';
        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(`${gameState.combo} COMBO!`, CANVAS_WIDTH / 2, 82);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(barX, barY, barWidth, barHeight);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(barX, barY, barWidth, barHeight);

        const fillRatio = Math.max(0, gameState.comboTimer / gameState.maxComboTimer);
        const currentFillWidth = barWidth * fillRatio;

        let fillColor = '#2ecc71';
        if (fillRatio < 0.3) {
            fillColor = '#e74c3c';
        } else if (fillRatio < 0.6) {
            fillColor = '#f39c12';
        }

        ctx.fillStyle = fillColor;
        ctx.fillRect(barX, barY, currentFillWidth, barHeight);
    }
}

// --- 4. 게임 리셋 및 재시작 처리 ---
const restartBtn = document.getElementById('restart-btn');
const menuBtn = document.getElementById('menu-btn');

function resetGame() {
    gameState.score = 0;
    gameState.combo = 0;
    gameState.comboTimer = 0;
    gameState.health = gameState.maxHealth;
    gameState.gameTime = 0;
    gameState.gameSpeedMultiplier = 1.0;
    gameState.isPaused = false;
    enemies = [];
    spawnTimer = 0;
    currentSpawnInterval = 90;
    player.reset();
    
    restartBtn.style.display = 'none';
    menuBtn.disabled = false;
}

// --- 5. 입력 처리 ---
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        if (gameState.health > 0 && !e.repeat && !gameState.isPaused) {
            player.turnAround();
        }
    }
});

restartBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    resetGame();
});

menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (gameState.health > 0) {
        gameState.isPaused = !gameState.isPaused;
    }
});

// --- 6. 메인 게임 루프 ---
function update() {
    if (gameState.isPaused || gameState.health <= 0) return;

    // 1. 게임 실행 시간 증가 및 난이도 가속 계산
    gameState.gameTime++;
    
    // 약 10초(600프레임)마다 속도 및 스폰 속도 난이도 상승 (최대 2.2배까지 가속)
    gameState.gameSpeedMultiplier = Math.min(2.2, 1.0 + (gameState.gameTime / 600) * 0.15);
    
    // 적 스폰 주기 가속 (90프레임에서 최소 28프레임까지 단축)
    currentSpawnInterval = Math.max(28, 90 - Math.floor(gameState.gameTime / 120) * 5);

    player.update();

    // 2. 콤보 게이지 감소 로직
    if (gameState.combo > 0) {
        const drainRate = (0.9 + (gameState.combo * 0.09)) * gameState.gameSpeedMultiplier;
        gameState.comboTimer -= drainRate;

        if (gameState.comboTimer <= 0) {
            gameState.comboTimer = 0;
            gameState.combo = 0;
        }
    }

    // 3. 적 스폰
    spawnTimer++;
    if (spawnTimer >= currentSpawnInterval) {
        const side = Math.random() < 0.5 ? 'LEFT' : 'RIGHT';
        enemies.push(new Enemy(side));
        spawnTimer = 0;
    }

    // 4. 적 업데이트 및 피격 판정
    for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        enemy.update();

        const dist = Math.abs(enemy.x - player.x);
        if (dist < player.radius + enemy.radius - 12) {
            enemies.splice(i, 1);
            gameState.health--;
            
            gameState.combo = 0;
            gameState.comboTimer = 0;

            if (gameState.health <= 0) {
                restartBtn.style.display = 'block';
                menuBtn.disabled = true;
            }
        }
    }
}

function render() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    drawEnvironment();

    enemies.forEach(enemy => enemy.draw());

    player.draw();
    drawUI();

    // 일시정지 UI
    if (gameState.isPaused && gameState.health > 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
    }

    // 게임 오버 UI
    if (gameState.health <= 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.fillStyle = '#ff7675';
        ctx.font = 'bold 44px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 60);

        ctx.fillStyle = '#ffffff';
        ctx.font = '22px sans-serif';
        ctx.fillText(`FINAL SCORE: ${gameState.score}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
    }
}

function gameLoop() {
    if (gameState.isRunning) {
        update();
        render();
    }
    requestAnimationFrame(gameLoop);
}

// --- 7. 실행 ---
requestAnimationFrame(gameLoop);
</script>

</body>
</html>

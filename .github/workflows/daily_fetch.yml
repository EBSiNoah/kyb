name: T04 Daily Data Fetcher

on:
  schedule:
    - cron: '0 10 * * *'  # KST 19:00 (UTC 10:00) 매일 자동 실행
  workflow_dispatch:

jobs:
  run-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Live Collector
        working-directory: ./rice
        env:
          ricekey: ${{ secrets.ricekey }}
        run: python rice/scripts/collect_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rice/data/
          git commit -m "chore: update daily T04 data and status [skip ci]" || exit 0
          git push

name: Daily Rice Auction Data Collection

on:
  schedule:
    # 매일 한국 시간 14:00 (UTC 05:00) 자동 실행
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '수집할 날짜 (YYYY-MM-DD)'
        required: false
        default: ''

# GITHUB_TOKEN에 저장소 쓰기 권한을 명시적으로 부여.
# 저장소 기본 설정(Settings > Actions > General > Workflow permissions)이
# "Read repository contents permission"(읽기 전용)이어도 이 워크플로우는 항상 push가 가능하도록 함.
permissions:
  contents: write

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 수집 스크립트 실행
      env:
        mesokey: ${{ secrets.mesokey }}
      run: |
        # target_date 파라미터를 파이썬 실행 인자로 전달
        python rice/scripts/collect_data.py ${{ github.event.inputs.target_date }}

    - name: 변경된 데이터 파일 Git Commit & Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add rice/data/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update exchange rate data [${{ github.event.inputs.target_date || 'Today' }}]" && git push)
